name: ui-install
description: >-
  pnpm (version from ui/package.json "packageManager"), the pnpm store restored from cache (keyed on
  both lockfiles + node version, with a prefix fallback so a dependency change only downloads the
  difference), then `pnpm install --frozen-lockfile` in ui; its `prepare` installs proto and builds
  proto/ts/dist. Fetch timeout and retries come from ui/.npmrc and proto/.npmrc.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: ui/package.json
    - id: pnpm
      shell: bash
      run: |
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-store-${{ runner.os }}-${{ steps.pnpm.outputs.node }}-${{ hashFiles('ui/pnpm-lock.yaml', 'proto/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ steps.pnpm.outputs.node }}-
    - shell: bash
      working-directory: ui
      run: pnpm install --frozen-lockfile
