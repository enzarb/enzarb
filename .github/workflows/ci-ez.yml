name: ci-ez
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      component: ez
  # No image and no release yet: ez is to be built into the sandbox image from source (ADR-0028).
  ci:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: ez
      cargo-args: -p ez-acp -p ez-claude -p ez-cli -p ez-core -p ez-hooks -p ez-llm -p ez-mcp -p ez-mise -p ez-tools -p ez-workflow
