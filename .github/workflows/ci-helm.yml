name: ci-helm
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      component: helm
  chart:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # compat reads the previous helm/v* tag's values with git show
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: pip install jsonschema pyyaml
      - run: mise run lint
      - run: mise run compat
      - run: mise run golden
      - run: mise run componentversions
      - run: mise run npmtoken
      - run: mise run kubeconform
      - run: mise run pgop
