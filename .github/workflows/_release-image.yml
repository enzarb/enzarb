# Reusable: release one image component at a fixed version in a single run with GITHUB_TOKEN
# (docs/ci.md "Releases"). With retag, first looks for the CI image ghcr.io/enzarb/<image>:sha-<short> built
# from <sha> and, if found, adds <version> and latest to it (same digest, no rebuild). Otherwise builds it at
# <sha> (same names, contexts and smoke test as _docker.yml) and pushes <version>, latest and sha-<short>.
# Either way it then creates the annotated <dir>/v<version> tag (only once the image tags exist) and a
# --latest=false GitHub Release; the log says which path was taken. Used by release.yml (one component)
# and rebuild-all.yml (matrix). dry_run reports the path (would retag) or builds with --load; it pushes,
# tags and releases nothing.
name: release-image
on:
  workflow_call:
    inputs:
      dir: {type: string, required: true}
      image: {type: string, required: true}
      context: {type: string, required: true}
      smoke: {type: string, default: ""}
      timeout: {type: number, default: 30}
      version: {type: string, required: true}
      sha: {type: string, required: true}
      dry_run: {type: boolean, default: false}
      retag:
        description: Reuse the CI sha- image when it was built from this sha (else build)
        type: boolean
        default: false
      note:
        description: Suffix for the tag message, e.g. " (rebuild-all)"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: write
      packages: write
    env:
      SHA: ${{ inputs.sha }}
      DIR: ${{ inputs.dir }}
      IMAGE: ghcr.io/enzarb/${{ inputs.image }}
      SCOPE: ${{ inputs.image }}
      CONTEXT: ${{ inputs.context }}
      SMOKE: ${{ inputs.smoke }}
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      RETAG: ${{ inputs.retag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0   # release notes start at the previous tag
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose retag or build
        id: path
        run: .github/scripts/retag-or-build.sh check
      - name: Retag the CI image
        if: steps.path.outputs.mode == 'retag' && !inputs.dry_run
        run: .github/scripts/retag-or-build.sh retag
      - name: Build (and push unless dry run)
        if: steps.path.outputs.mode == 'build'
        run: |
          set -euo pipefail
          tags=("$IMAGE:$VERSION" "$IMAGE:latest" "$IMAGE:sha-${SHA::7}")
          args=(-f "$DIR/Dockerfile" --cache-from "type=gha,scope=$SCOPE" --cache-to "type=gha,mode=max,scope=$SCOPE"
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$SHA"
            --label "org.opencontainers.image.version=$VERSION")
          if [ -n "$SMOKE" ] || [ "$DRY_RUN" = true ]; then
            args+=(--load -t "$IMAGE:ci")   # loaded first; smoke-tested and pushed by the next steps
          else
            for t in "${tags[@]}"; do args+=(-t "$t"); done
            args+=(--push)
          fi
          docker buildx build "${args[@]}" "$CONTEXT"
      - name: Smoke test
        if: steps.path.outputs.mode == 'build' && inputs.smoke != ''
        working-directory: ${{ inputs.dir }}
        run: ./"$SMOKE" "$IMAGE:ci"
      - name: Tag and push the smoke-tested image
        if: steps.path.outputs.mode == 'build' && inputs.smoke != '' && !inputs.dry_run
        run: |
          set -euo pipefail
          for t in "$IMAGE:$VERSION" "$IMAGE:latest" "$IMAGE:sha-${SHA::7}"; do
            docker tag "$IMAGE:ci" "$t"; docker push "$t"
          done
      - name: Tag and release ${{ inputs.dir }}/v${{ inputs.version }}
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          tag="$DIR/v$VERSION"
          last=$(git tag --list "$DIR/v[0-9]*" | grep -E "^$DIR/v[0-9]+\.[0-9]+\.[0-9]+\$" | sort -V | tail -1 || true)
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"   # re-run after a failed release step
            last=$(git tag --list "$DIR/v[0-9]*" | grep -E "^$DIR/v[0-9]+\.[0-9]+\.[0-9]+\$" | sort -V | grep -vx "$tag" | tail -1 || true)
          else
            git config user.name "enzarb-release[bot]"
            git config user.email "release@enzarb.dev"
            git tag -a "$tag" -m "release $tag$NOTE" "$SHA"
            git push origin "refs/tags/$tag"
          fi
          flags=(--latest=false)
          [ -n "$last" ] && flags+=(--notes-start-tag "$last")
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "$tag" --generate-notes "${flags[@]}"
          echo "released $tag ($IMAGE:$VERSION)" >> "$GITHUB_STEP_SUMMARY"
