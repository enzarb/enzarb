# Reusable: fmt / clippy / test for one Rust component (docs/ci.md "Rust repos"), plus its image.
# One Cargo workspace at the repo root: jobs run at the root and select the component's crates with
# `-p` flags (cargo-args); rust-cache is keyed per component and job.
name: rust
on:
  workflow_call:
    inputs:
      dir:
        type: string
        required: true
      cargo-args:
        description: Package selection and extra args for clippy, nextest and doctests (e.g. `-p enzarb-updater --all-features`); always pass `-p`, a bare root run covers every crate
        type: string
        default: ""
      node:
        description: Install the node version pinned in the root mise.toml for tests
        type: boolean
        default: false
      image:
        description: Image name under ghcr.io/enzarb/ (empty = no docker job)
        type: string
        default: ""
      context:
        description: Docker build context (`.`, the repo root, since every Rust image builds the root workspace)
        type: string
        default: ""
      postgres:
        description: Start one shared Postgres 18 for the test job and export ENZARB_TEST_PG_URL (integration tests then use a database per test instead of a container per test)
        type: boolean
        default: false
      smoke:
        type: string
        default: ""
      docker-timeout:
        type: number
        default: 30
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt
          rust-src-dir: .
      - run: cargo fmt --all --check
      - name: No [patch], no git deps on enzarb repos, one lockfile and toolchain file
        run: scripts/monorepo/check-cargo-deps.sh
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: clippy
          rust-src-dir: .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ inputs.dir }}-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets ${{ inputs.cargo-args }} -- -D warnings
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rust-src-dir: .
      - uses: ./.github/actions/setup-node
        if: inputs.node
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ inputs.dir }}-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # One Postgres for the whole run (a service container cannot take server args or be
      # conditional, hence docker run). Without it, tests fall back to a testcontainer each.
      - name: Shared Postgres
        if: inputs.postgres
        run: |
          docker run -d --name enzarb-test-pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=postgres \
            --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-retries 30 \
            postgres:18 -c max_connections=1000 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          until [ "$(docker inspect -f '{{.State.Health.Status}}' enzarb-test-pg)" = healthy ]; do sleep 1; done
          echo "ENZARB_TEST_PG_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - run: cargo nextest run ${{ inputs.cargo-args }}
      - run: cargo test --doc ${{ inputs.cargo-args }}
  docker:
    if: inputs.image != ''
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: ${{ inputs.dir }}
      image: ${{ inputs.image }}
      context: ${{ inputs.context || inputs.dir }}
      smoke: ${{ inputs.smoke }}
      timeout: ${{ inputs.docker-timeout }}
