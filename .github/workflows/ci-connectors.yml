name: ci-connectors
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'connectors/**'
      - 'workflows/crates/flow/**'
      - .github/workflows/ci-connectors.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'connectors/**'
      - 'workflows/crates/flow/**'
      - .github/workflows/ci-connectors.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: connectors
      cargo-args: -p enzarb-connector -p enzarb-connector-github -p enzarb-receiver --all-features
      postgres: true
      image: enzarb-connectors-receiver
      context: .
