# Reusable: build one component image once per commit (docs/ci.md "Docker images").
# PRs build (and smoke-test when `smoke` is set) without pushing. Pushes to main and the component's own
# `<dir>/vX.Y.Z` tags push ghcr.io/enzarb/<image>; a tag build is tagged with the bare X.Y.Z plus `latest`.
name: docker
on:
  workflow_call:
    inputs:
      dir:
        description: Component directory (also the tag prefix, `<dir>/v*`)
        type: string
        required: true
      image:
        description: Image name under ghcr.io/enzarb/ (also the GHA cache scope)
        type: string
        required: true
      context:
        description: Build context; `.` for components with path deps (Dockerfile is always <dir>/Dockerfile)
        type: string
        required: true
      smoke:
        description: Optional smoke script relative to <dir>, run against the loaded image before pushing
        type: string
        default: ""
      timeout:
        type: number
        default: 30
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/enzarb/${{ inputs.image }}
      SCOPE: ${{ inputs.image }}
      DIR: ${{ inputs.dir }}
      CONTEXT: ${{ inputs.context }}
      SMOKE: ${{ inputs.smoke }}
      # Callers only trigger on main pushes, PRs and their own `<dir>/v*` tags.
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, format('refs/tags/{0}/v', inputs.dir))) }}
      CACHE_TO: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the component tag
        id: ver
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#"$DIR"/v}; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enzarb/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.version != '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build (and push on main / component tags)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          args=(-f "$DIR/Dockerfile" --cache-from "type=gha,scope=$SCOPE")
          [ "$CACHE_TO" = true ] && args+=(--cache-to "type=gha,mode=max,scope=$SCOPE")
          while read -r l; do [ -z "$l" ] || args+=(--label "$l"); done <<< "$LABELS"
          if [ -n "$SMOKE" ]; then
            # Smoke-tested images are loaded first and pushed by the next steps.
            args+=(--load -t "$IMAGE:ci")
          else
            while read -r t; do [ -z "$t" ] || args+=(-t "$t"); done <<< "$TAGS"
            if [ "$PUSH" = true ]; then args+=(--push); else args+=(--load); fi
          fi
          docker buildx build "${args[@]}" "$CONTEXT"
      - name: Smoke test
        if: inputs.smoke != ''
        working-directory: ${{ inputs.dir }}
        run: ./"$SMOKE" "$IMAGE:ci"
      - name: Tag and push
        if: inputs.smoke != '' && env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r t; do
            [ -z "$t" ] || { docker tag "$IMAGE:ci" "$t"; docker push "$t"; }
          done <<< "$TAGS"
