name: sync-components
# Reconciliation safety net (docs/ci.md "Releases"): on a 6-hourly schedule and manual dispatch, pins
# helm/enzarb/values.yaml to the latest <dir>/v* tag of every component and, if that or any helm/ commit
# is releasable, publishes the next chart in the same run (_release-chart.yml, GITHUB_TOKEN only).
# release.yml normally does this right after each component release.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  sync:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_release-chart.yml
    with:
      ref: main
