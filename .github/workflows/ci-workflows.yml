name: ci-workflows
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      component: workflows
  ci:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: workflows
      cargo-args: -p engine -p enzarb-workflows -p enzarb-flow
      postgres: true
      image: enzarb-workflows
      context: .
