name: ci-workflows
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      component: workflows
  ci:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: workflows
      cargo-args: -p engine -p enzarb-workflows -p enzarb-flow
      postgres: true
      image: enzarb-workflows
      context: .
  # `enzarb-lint contracts`: library YAML and prompt markers against the contract-test
  # registry (docs/workflows/contract-tests.md, "Library check").
  contracts-stdlib:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run -p enzarb-flow --bin enzarb-lint -- contracts workflows/crates/engine/tests/stdlib --registry workflows/crates/engine/tests/contract-registry.yaml --format github
  contracts-v1:
    needs: changes
    # Fork PRs get no secrets, so the App token cannot be minted: skip the job (contracts-stdlib still runs).
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Non-blocking only because the prompts of enzarb/workflows@v1 carry no promise markers yet and
    # that repo is changed separately. Drop continue-on-error once v1 carries them. A failed token
    # mint or checkout fails its step (and the job), it no longer skips the lint.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENZARB_CI_APP_ID }}
          private-key: ${{ secrets.ENZARB_CI_APP_PRIVATE_KEY }}
          owner: enzarb
          repositories: workflows
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: enzarb/workflows
          ref: v1
          path: .lib/workflows
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - run: echo "linting enzarb/workflows@v1 ($(git -C .lib/workflows rev-parse HEAD))"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run -p enzarb-flow --bin enzarb-lint -- contracts .lib/workflows --registry workflows/crates/engine/tests/contract-registry.yaml --format github
