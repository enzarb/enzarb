name: ci-workflows
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'workflows/**'
      - 'operator/**'
      - 'connectors/**'
      - 'proto/**'
      - .github/workflows/ci-workflows.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'workflows/**'
      - 'operator/**'
      - 'connectors/**'
      - 'proto/**'
      - .github/workflows/ci-workflows.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: workflows
      cargo-args: -p engine -p enzarb-workflows -p enzarb-flow
      postgres: true
      image: enzarb-workflows
      context: .
