name: ci-workflows
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      component: workflows
  ci:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: workflows
      cargo-args: -p engine -p enzarb-workflows -p enzarb-flow
      postgres: true
      image: enzarb-workflows
      context: .
  # `enzarb-lint contracts`: library YAML and prompt markers against the contract-test
  # registry (docs/workflows/contract-tests.md, "Library check").
  contracts-stdlib:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run -p enzarb-flow --bin enzarb-lint -- contracts workflows/crates/engine/tests/stdlib --registry workflows/crates/engine/tests/contract-registry.yaml --format github
  contracts-v1:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Blocking: enzarb/workflows@v1 passes the check (0 errors; documented gaps are warnings).
    # The library is public, so no token is needed; a failed checkout fails the job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: enzarb/workflows
          ref: v1
          path: .lib/workflows
          persist-credentials: false
      - run: echo "linting enzarb/workflows@v1 ($(git -C .lib/workflows rev-parse HEAD))"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run -p enzarb-flow --bin enzarb-lint -- contracts .lib/workflows --registry workflows/crates/engine/tests/contract-registry.yaml --format github
