name: ci-realtime
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'realtime/**'
      - .github/workflows/ci-realtime.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'realtime/**'
      - .github/workflows/ci-realtime.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: realtime
      cargo-args: -p enzarb-realtime
      image: enzarb-realtime
      context: .
      postgres: true
