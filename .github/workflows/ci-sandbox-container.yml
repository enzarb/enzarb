name: ci-sandbox-container
on:
  push:
    branches: [main]
    paths:
      - 'sandbox-container/**'
      - 'proto/**'
      - ui/package-lock.json
      - .github/workflows/ci-sandbox-container.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
  pull_request:
    paths:
      - 'sandbox-container/**'
      - 'proto/**'
      - ui/package-lock.json
      - .github/workflows/ci-sandbox-container.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  playwright-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash sandbox-container/scripts/check-playwright-version.sh
  ci:
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: sandbox-container
      cargo-args: --locked
      node: '24'
      image: enzarb-sandbox
      context: .
      smoke: scripts/smoke.sh
      docker-timeout: 40
