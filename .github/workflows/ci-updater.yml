name: ci-updater
on:
  push:
    branches: [main]
    tags: ['updater/v*']
    paths: &paths
      - 'updater/**'
      - .github/workflows/ci-updater.yml
      - .github/workflows/_rust.yml
      - .github/workflows/_docker.yml
  pull_request:
    paths: *paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/_rust.yml
    permissions:
      contents: read
      packages: write
    with:
      dir: updater
      image: enzarb-updater
