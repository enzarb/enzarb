# proto is not released: it is consumed in-tree (Rust path deps, ui `file:../proto`), so the old
# GitHub Packages publish of @enzarb/proto is gone. These checks still guard the crate and TS package.
name: ci-proto
on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - .github/workflows/ci-proto.yml
  pull_request:
    paths:
      - 'proto/**'
      - .github/workflows/ci-proto.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    working-directory: proto
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt
          rust-src-dir: proto
      - run: cargo fmt --all --check
      - name: No [patch] and no git deps on enzarb repos
        run: |
          if grep -rnE --include=Cargo.toml --include=Cargo.lock --exclude-dir=target --exclude-dir=node_modules '^\[+patch|git\+(https|ssh)://[^"]*enzarb|git *= *"[^"]*enzarb' .; then
            echo "::error::use path deps for enzarb crates"; exit 1
          fi

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: all
            flags: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: clippy
          rust-src-dir: proto
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto -> target
          key: proto-clippy-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo clippy --workspace --all-targets ${FLAGS:+$FLAGS} -- -D warnings

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: all
            flags: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rust-src-dir: proto
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto -> target
          key: proto-test-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: nextest
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo nextest run --workspace ${FLAGS:+$FLAGS}
      - name: doctests
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo test --workspace --doc ${FLAGS:+$FLAGS}

  gen:
    name: ctrl.gen.ts is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rust-src-dir: proto
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto -> target
          key: proto-gen
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same as `mise run proto:gen -- --check`.
      - run: bash ../.mise/tasks/proto/gen --check

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: proto/package-lock.json
      # `npm ci` runs `prepare`, which builds ts/ -> ts/dist with tsc.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: npm pack produces a working package (ui installs it via file:../proto)
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npm pack --silent --pack-destination "$out"
          tarball="$(ls "$out"/*.tgz)"
          tar -tzf "$tarball" > "$out/list.txt"
          grep -q '^package/ts/dist/index.js$' "$out/list.txt"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          npm install --silent "$tarball"
          node --input-type=module -e "import('@enzarb/proto').then(m => { if (m.PROTOCOL_VERSION !== 1 || typeof m.Session !== 'function') process.exit(1); console.log('ok'); })"
