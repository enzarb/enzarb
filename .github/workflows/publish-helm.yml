name: publish-helm
# Manual republish of an existing helm/vX.Y.Z tag: packages the chart at that tag, pushes it to
# oci://ghcr.io/enzarb/charts and makes sure its GitHub Release exists, is published and is latest.
# Normal chart releases are published by _release-chart.yml in the release run itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing helm/vX.Y.Z tag
        type: string
        required: true
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
env:
  MISE_CEILING_PATHS: ${{ github.workspace }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helm
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the tag
        working-directory: .
        run: |
          [[ $TAG =~ ^helm/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a helm/vX.Y.Z tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Package and push oci://ghcr.io/enzarb/charts/enzarb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          v="${TAG#helm/v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm package enzarb --version "$v" --app-version "$v" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/enzarb-$v.tgz" oci://ghcr.io/enzarb/charts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `releases/tags/{tag}` does not return drafts, so match tag_name in the full list.
          find_id() {
            gh api --paginate "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
            id=$(find_id)
          fi
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -f make_latest=true >/dev/null
