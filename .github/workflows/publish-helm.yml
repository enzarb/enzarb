name: publish-helm
# Packages the chart at the version of the helm/vX.Y.Z tag the release workflow created and pushes it
# to GHCR, then publishes the GitHub release. release.yml creates helm releases as drafts, so the
# `release: published` webhook (enzarb-updater) only fires once the chart is in the registry. A failed
# push leaves the draft; re-running this workflow publishes it.
on:
  push:
    tags: ["helm/v*"]
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
env:
  MISE_CEILING_PATHS: ${{ github.workspace }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
          working_directory: helm
      - name: Package and push oci://ghcr.io/enzarb/charts/enzarb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          v="${GITHUB_REF_NAME#helm/v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          helm package enzarb --version "$v" --app-version "$v" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/enzarb-$v.tgz" oci://ghcr.io/enzarb/charts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # `releases/tags/{tag}` (and so `gh release view <tag>`) does not return drafts, so find the
          # release by listing and matching tag_name, which includes drafts; then publish it by id.
          find_id() {
            gh api --paginate "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1
          }
          # release.yml may not have created its draft yet (it runs in parallel); the chart is already
          # pushed, so creating the release published is safe. release.yml tolerates losing that race.
          id=$(find_id)
          if [ -z "$id" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes || true
            id=$(find_id)   # if create lost a race with release.yml's draft, it is found here
          fi
          if [ -z "$id" ]; then echo "no release found for $GITHUB_REF_NAME" >&2; exit 1; fi
          # helm releases are the repo's "Latest" release (component releases are created --latest=false).
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -f make_latest=true >/dev/null
