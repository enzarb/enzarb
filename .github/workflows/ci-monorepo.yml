name: ci-monorepo
# Monorepo plumbing: scripts/monorepo/*, shell scripts, workflow syntax, and the checks that keep the
# generated graph, affected.sh and changes.sh consistent (docs/ci.md).
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      component: monorepo
  scripts:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generated dependency graph is up to date
        run: scripts/monorepo/gen-graph.sh --check
      - name: Dependency graph generator picks up cargo and npm path deps
        run: scripts/monorepo/test-graph.sh
      - name: Affected-components mapping, ci-*.yml wiring and changes.sh
        run: scripts/monorepo/test-affected.sh
      - name: Mechanical-delta classifier
        run: bash scripts/monorepo/test-mechanical.sh
      - name: Tool pins are only in the root mise.toml and match the Dockerfile ARGs
        run: scripts/monorepo/check-tool-pins.sh
      - name: Tool-pin check self-test
        run: bash scripts/monorepo/test-tool-pins.sh
      - name: Retag dry-run check, with a stubbed docker
        run: bash scripts/monorepo/test-retag-or-build.sh
      - name: Next-version diff, on a scratch repo
        run: bash scripts/monorepo/test-next-version-diff.sh
      - name: shellcheck (preinstalled on ubuntu-latest)
        run: shellcheck --exclude=SC1091 scripts/monorepo/*.sh .github/scripts/*.sh .mise/tasks/test/pg .mise/tasks/graph/gen
  actionlint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
