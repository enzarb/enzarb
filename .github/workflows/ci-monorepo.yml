name: ci-monorepo
# Monorepo plumbing: scripts/monorepo/*, shell scripts, workflow syntax, and the drift check that
# keeps scripts/monorepo/affected.sh in step with the paths: filters of ci-*.yml (docs/ci.md).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.mise/tasks/**'
      - '.mise/lib/**'
      - '.github/workflows/**'
      - mise.toml
      - 'mise.*.toml'
      - '*/mise.toml'
      - '*/Dockerfile'
      - '*/rust-toolchain.toml'
      - kubernetes/hack/versions.env
  pull_request:
    paths:
      - 'scripts/**'
      - '.mise/tasks/**'
      - '.mise/lib/**'
      - '.github/workflows/**'
      - mise.toml
      - 'mise.*.toml'
      - '*/mise.toml'
      - '*/Dockerfile'
      - '*/rust-toolchain.toml'
      - kubernetes/hack/versions.env
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Affected-components mapping matches the CI path filters
        run: scripts/monorepo/test-affected.sh
      - name: Mechanical-delta classifier
        run: bash scripts/monorepo/test-mechanical.sh
      - name: Tool pins are only in the root mise.toml and match the Dockerfile ARGs
        run: scripts/monorepo/check-tool-pins.sh
      - name: Tool-pin check self-test
        run: bash scripts/monorepo/test-tool-pins.sh
      - name: shellcheck (preinstalled on ubuntu-latest)
        run: shellcheck --exclude=SC1091 scripts/monorepo/*.sh .mise/tasks/test/pg
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
