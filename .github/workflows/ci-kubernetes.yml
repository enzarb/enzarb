name: ci-kubernetes
on:
  push:
    branches: [main]
    tags: ['kubernetes/v*']
    paths: &paths
      - 'kubernetes/**'
      - .github/workflows/ci-kubernetes.yml
  pull_request:
    paths: *paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Use kubernetes/mise.toml only, not the workspace-wide root mise.toml.
  MISE_CEILING_PATHS: ${{ github.workspace }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
defaults:
  run:
    working-directory: kubernetes
jobs:
  validate:
    name: render + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
          working_directory: kubernetes
      - name: Render and validate overlays
        run: ./hack/validate.sh

  ansible:
    name: ansible-lint + syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
          working_directory: kubernetes
      - name: Lint and syntax-check the host roles
        working-directory: kubernetes/rke2
        run: |
          set -euo pipefail
          ansible-galaxy collection install -r requirements.yml -p collections
          ansible-lint -q .
          ansible-playbook site.yml --syntax-check
          ansible-playbook reset.yml --syntax-check

  vendored-drift:
    name: vendored bases drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
          working_directory: kubernetes
      - name: Vendored bases are up to date
        run: |
          set -euo pipefail
          source hack/versions.env
          [ "v$(mise current helm)" = "$HELM_VERSION" ] || { echo "::error::mise.toml helm != HELM_VERSION"; exit 1; }
          helm version --short
          ./hack/refresh-vendored.sh
          git diff --exit-code -- base || { echo "::error::vendored bases drifted; run hack/refresh-vendored.sh"; exit 1; }

  installer-image:
    name: gvisor installer image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/enzarb/enzarb-gvisor-installer
    steps:
      - uses: actions/checkout@v4
      - name: Version from the component tag
        id: ver
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#kubernetes/v}; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.version != '' }}
      - name: Build (amd64) and smoke-test
        run: |
          set -euo pipefail
          set -a; source hack/versions.env; set +a
          docker buildx build -f installer/Dockerfile \
            --build-arg GVISOR_VERSION --build-arg GVISOR_SHA512_X86_64 --build-arg GVISOR_SHA512_AARCH64 \
            --cache-from type=gha,scope=gvisor-installer \
            --load -t installer:test .
          # Bundle present and runnable; curl/nsenter/cmp available without apk at runtime.
          out=$(docker run --rm --entrypoint /opt/gvisor/runsc installer:test --version)
          got=${out%%$'\n'*}
          [ "$got" = "runsc version release-$GVISOR_VERSION" ] || { echo "unexpected: $got" >&2; exit 1; }
          docker run --rm --entrypoint sh installer:test -c 'for t in curl nsenter cmp grep; do command -v $t >/dev/null || { echo missing $t; exit 1; }; done; test -s /opt/enzarb/runsc.toml'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kubernetes/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (amd64 + arm64)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kubernetes/v'))
        run: |
          set -euo pipefail
          set -a; source hack/versions.env; set +a
          args=()
          while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          docker buildx build -f installer/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg GVISOR_VERSION --build-arg GVISOR_SHA512_X86_64 --build-arg GVISOR_SHA512_AARCH64 \
            --cache-from type=gha,scope=gvisor-installer \
            --cache-to type=gha,mode=max,scope=gvisor-installer \
            "${args[@]}" --push .
