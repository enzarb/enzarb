name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - run: npm run lint

  # Component tests on a plain runner: browser cached, system libs via install-deps.
  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: npm run test:unit -- --run --project client

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:unit -- --run --project server

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/enzarb/enzarb-ui
      PUSH: ${{ github.event_name != 'pull_request' }}
      SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enzarb/enzarb-ui
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/enzarb/enzarb-ui
      - name: Build (and push on main / tags)
        run: |
          args=(--cache-from "type=gha,scope=enzarb-ui")
          if [ "$SAVE_CACHE" = true ]; then
            args+=(--cache-to "type=gha,mode=max,scope=enzarb-ui")
          fi
          if [ "$PUSH" = true ]; then
            args+=(--push)
            while read -r t; do [ -z "$t" ] || args+=(-t "$t"); done <<< "$TAGS"
            while read -r l; do [ -z "$l" ] || args+=(--label "$l"); done <<< "$LABELS"
          fi
          docker buildx build "${args[@]}" \
            --secret id=node_auth_token,env=NODE_AUTH_TOKEN .
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
