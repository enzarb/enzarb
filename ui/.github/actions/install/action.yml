name: install
description: Restore node_modules from cache (keyed on lockfile + node version); npm ci on a miss.
inputs:
  token:
    description: Token for npm.pkg.github.com
    required: true
runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node_modules-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci # repo .npmrc reads NODE_AUTH_TOKEN
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
