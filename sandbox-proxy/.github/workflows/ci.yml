name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
            ${{ secrets.ENZARB_CRDS_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build \
            --secret id=proto_key,env=PROTO_KEY \
            --secret id=crds_key,env=CRDS_KEY .
        env:
          PROTO_KEY: ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
          CRDS_KEY: ${{ secrets.ENZARB_CRDS_DEPLOY_KEY }}
