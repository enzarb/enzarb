name: image
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/enzarb/enzarb-sandbox-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enzarb/enzarb-sandbox-proxy
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/enzarb/enzarb-sandbox-proxy
      - name: Build and push
        run: |
          args=()
          while read -r t; do [ -z "$t" ] || args+=(-t "$t"); done <<< "$TAGS"
          while read -r l; do [ -z "$l" ] || args+=(--label "$l"); done <<< "$LABELS"
          docker build "${args[@]}" \
            --secret id=proto_key,env=PROTO_KEY \
            --secret id=crds_key,env=CRDS_KEY .
          docker push --all-tags "$IMAGE"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          PROTO_KEY: ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
          CRDS_KEY: ${{ secrets.ENZARB_CRDS_DEPLOY_KEY }}
