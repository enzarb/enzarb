# Workspace-local Cargo config. It applies to every enzarb-*/ Rust repo built
# from inside this directory; CI clones a repo alone and doesn't see it.
#
# Each repo keeps its own target/ so parallel builds in different repos don't
# block each other on a shared lock.

[net]
# Private enzarb repos are git dependencies over ssh; use the git CLI (ssh agent).
git-fetch-with-cli = true

# Services depend on libraries as
#   enzarb-proto = { git = "ssh://git@github.com/enzarb/enzarb-proto.git", branch = "main" }
# Locally, build against the sibling checkout instead. Add an entry only once the
# crate exists: a patch pointing at a missing crate breaks every build.

[patch."ssh://git@github.com/enzarb/enzarb-connectors.git"]
enzarb-connector = { path = "enzarb-connectors/crates/connector" }
