# Workspace-local Cargo config. It applies to every Rust crate in the repo (one Cargo
# workspace at the root); CI clones the repo alone and doesn't see it.
#
# There is a single target/ at the root, shared by every component. Cargo's build-directory
# lock serialises concurrent builds; use `-p <crate>` so a component only builds its own graph.

[net]
# Private enzarb repos are git dependencies over ssh; use the git CLI (ssh agent).
git-fetch-with-cli = true

# There are deliberately no [patch] entries here. Cargo records patches in Cargo.lock
# (including unused ones), which would leak local paths into the committed lockfile. Library
# changes are merged to main before dependents use them; run `cargo update -p <crate>` to pick
# them up. For a quick experiment against an unmerged sibling, add a temporary [patch] in the root
# Cargo.toml and don't commit it.
