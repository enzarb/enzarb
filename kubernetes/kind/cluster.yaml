# Dev cluster: 1 control-plane + 1 worker. Host 80/443 map to the fixed Envoy
# Gateway NodePorts (30080/30443) set by overlays/dev.
# Resolve the host name locally:  echo '127.0.0.1 enzarb.local' | sudo tee -a /etc/hosts
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: enzarb
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 80, listenAddress: "127.0.0.1", protocol: TCP }
      - { containerPort: 30443, hostPort: 443, listenAddress: "127.0.0.1", protocol: TCP }
  - role: worker
