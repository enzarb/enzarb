name: ci
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: render + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Render and validate overlays
        run: ./hack/validate.sh

  vendored-drift:
    name: vendored bases drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Vendored bases are up to date
        run: |
          set -euo pipefail
          source hack/versions.env
          [ "v$(mise current helm)" = "$HELM_VERSION" ] || { echo "::error::mise.toml helm != HELM_VERSION"; exit 1; }
          helm version --short
          ./hack/refresh-vendored.sh
          git diff --exit-code -- base || { echo "::error::vendored bases drifted; run hack/refresh-vendored.sh"; exit 1; }
