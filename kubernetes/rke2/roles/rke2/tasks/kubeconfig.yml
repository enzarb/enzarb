# Writes ~/.kube/<cluster>.yaml on the machine running ansible, pointing at the node IP and
# with cluster/user/context renamed to rke2_cluster_name (so it never clobbers `default`).
- name: Read the server kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/rke2/rke2.yaml
  register: rke2_kubeconfig_raw
  no_log: true

- name: Local kubeconfig directory
  ansible.builtin.file:
    path: "{{ rke2_kubeconfig_dest | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  vars:
    ansible_become: false

- name: Write the local kubeconfig
  ansible.builtin.copy:
    dest: "{{ rke2_kubeconfig_dest }}"
    content: >-
      {{ (rke2_kubeconfig_raw.content | b64decode)
         | regex_replace('https://127\.0\.0\.1:6443', 'https://' ~ rke2_node_ip ~ ':6443')
         | regex_replace('(?m)^(\s*(?:name|cluster|user|current-context)): default$', '\1: ' ~ rke2_cluster_name)
         | regex_replace('(?m)^(- name): default$', '\1: ' ~ rke2_cluster_name) }}
    mode: "0600"
  delegate_to: localhost
  # ansible_become (inventory var) outranks the `become:` keyword, so override the variable.
  vars:
    ansible_become: false
  no_log: true
