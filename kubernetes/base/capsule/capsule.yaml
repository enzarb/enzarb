# Source: capsule/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capsule-controller-manager
  namespace: capsule-system
  labels:
    helm.sh/chart: capsule-0.14.6
    app.kubernetes.io/version: "0.14.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: capsule
    app.kubernetes.io/instance: capsule
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capsule
      app.kubernetes.io/instance: capsule
  template:
    metadata:
      annotations:
      labels:
        helm.sh/chart: capsule-0.14.6
        app.kubernetes.io/version: "0.14.6"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: capsule
        app.kubernetes.io/instance: capsule
    spec:
      serviceAccountName: capsule
      securityContext:
        runAsGroup: 1002
        runAsNonRoot: true
        runAsUser: 1002
        seccompProfile:
          type: RuntimeDefault
      hostPID: false
      priorityClassName: 
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: capsule-tls
      containers:
        - name: manager
          args:
            - --webhook-port=9443
            - --zap-log-level=info
            - --configuration-name=default
            - --workers=1
            - --client-connection-qps=20
            - --client-connection-burst=30
            - --cache-sync-timeout=4m
            - --enable-leader-election=true
          image: ghcr.io/projectcapsule/capsule:v0.14.6
          imagePullPolicy: IfNotPresent
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: SERVICE_ACCOUNT
            valueFrom:
              fieldRef:
                fieldPath: spec.serviceAccountName
          ports:
            - name: admission
              protocol: TCP
              containerPort: 9443
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health-api
              containerPort: 10080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 10080
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          resources:
            {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true

