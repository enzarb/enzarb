---
# Source: pgop/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgop
  namespace: pgop-system
  labels:
    helm.sh/chart: pgop-0.9.1
    app.kubernetes.io/name: pgop
    app.kubernetes.io/instance: pgop
    app.kubernetes.io/version: "v0.9.1"
    app.kubernetes.io/managed-by: Helm
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgop
      app.kubernetes.io/instance: pgop
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgop
        app.kubernetes.io/instance: pgop
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: pgop
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "ghcr.io/ruckc/pgop:v0.9.1"
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
