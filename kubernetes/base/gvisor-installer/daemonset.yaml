apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-installer
spec:
  selector:
    matchLabels: { app: gvisor-installer }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: gvisor-installer }
    spec:
      serviceAccountName: gvisor-installer
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
        enzarb.dev/gvisor-install: "true"
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: install
          # Tag/digest set by `images:` in kustomization.yaml (hack/pin-installer-digest.sh).
          image: ghcr.io/enzarb/enzarb-gvisor-installer
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            privileged: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: host, mountPath: /host }
      volumes:
        - name: host
          hostPath: { path: / }
