apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-installer
spec:
  selector:
    matchLabels: { app: gvisor-installer }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: gvisor-installer }
    spec:
      serviceAccountName: gvisor-installer
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
        enzarb.dev/gvisor-install: "true"
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: install
          # Needs apk (curl) at start; pin a digest for production.
          image: docker.io/library/alpine:3.22
          command: ["/bin/sh", "/scripts/install.sh"]
          envFrom:
            - configMapRef: { name: gvisor-installer }
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            privileged: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: host, mountPath: /host }
      volumes:
        - name: scripts
          configMap: { name: gvisor-installer }
        - name: host
          hostPath: { path: / }
