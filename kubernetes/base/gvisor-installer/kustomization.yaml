# Installs gVisor on real (non-kind) nodes. Opt-in per node via the label
# enzarb.dev/gvisor-install=true (see README "Production overlay"). For kind use
# hack/kind-install-gvisor.sh instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gvisor-installer
resources:
  - namespace.yaml
  - rbac.yaml
  - daemonset.yaml
configMapGenerator:
  - name: gvisor-installer
    options:
      disableNameSuffixHash: true
    literals:
      # Keep in sync with hack/versions.env (hack/validate.sh checks the version).
      - GVISOR_VERSION=20261005.0
      - GVISOR_SHA512_X86_64=79869ae9a589355a46d46fdac068d9a954e741741ffe77c64e38c56ea955498c1cb04e9bce44e1cce5155333e6b76bee72347c6661bb7c78fd2fe3aad198c8fe
      - GVISOR_SHA512_AARCH64=1bc58be6f881264ced1df8ff61db0205531abedcace005585ac5637c5c987831062b365f99f270ef0939849f130344b84e0f1a663294406f798b8f7c8cd326ac
    files:
      - install.sh
