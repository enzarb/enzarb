---
# Source: capsule-proxy/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capsule-proxy
  namespace: capsule-system
  labels:
    app.kubernetes.io/component: "proxy"
    helm.sh/chart: capsule-proxy-0.15.0
    app.kubernetes.io/name: capsule-proxy
    app.kubernetes.io/instance: capsule-proxy
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: "proxy"
      app.kubernetes.io/name: capsule-proxy
      app.kubernetes.io/instance: capsule-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: "proxy"
        app.kubernetes.io/name: capsule-proxy
        app.kubernetes.io/instance: capsule-proxy
    spec:
      serviceAccountName: capsule-proxy
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: 
      volumes:
      - name: certs
        secret:
          secretName: capsule-proxy
          defaultMode: 420
      containers:
      - name: capsule-proxy
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1002
          runAsNonRoot: true
          runAsUser: 1002
        image: ghcr.io/projectcapsule/capsule-proxy:v0.15.0
        imagePullPolicy: IfNotPresent
        args:
        - --listening-port=9001
        - --capsule-configuration-name=default
        - --zap-log-level=4
        - --enable-ssl=true
        - --oidc-username-claim=preferred_username
        - --enable-reflector=false
        - --rolebindings-resync-period=10h
        - --disable-caching=false
        - --auth-preferred-types=BearerToken,TLSCertificate
        - --ssl-cert-path=/opt/capsule-proxy/tls.crt
        - --ssl-key-path=/opt/capsule-proxy/tls.key
        - --client-connection-qps=20
        - --client-connection-burst=30
        - --enable-pprof=false
        - --enable-leader-election=false
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: proxy
          protocol: TCP
          containerPort: 9001
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: probe
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz/
            port: probe
            scheme: HTTP
          initialDelaySeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz/
            port: probe
            scheme: HTTP
          initialDelaySeconds: 5
        resources:
                limits:
                  cpu: 200m
                  memory: 128Mi
                requests:
                  cpu: 200m
                  memory: 128Mi
        volumeMounts:
        - mountPath: /opt/capsule-proxy
          name: certs
      restartPolicy: Always

