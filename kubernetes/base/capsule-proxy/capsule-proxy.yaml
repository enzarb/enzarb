---
# Source: capsule-proxy/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capsule-proxy:capsule-proxy
  labels:
    app.kubernetes.io/component: "proxy"
    helm.sh/chart: capsule-proxy-0.15.0
    app.kubernetes.io/name: capsule-proxy
    app.kubernetes.io/instance: capsule-proxy
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
rules:
  # Read (get/list/watch) everything (namespaced + cluster-scoped)
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Some clusters still have a few non-resource URLs you might want to read
  # (optional; remove if not needed)
  - nonResourceURLs: ["*"]
    verbs: ["get"]

  # Allow the controller to impersonate anyone
  # Core impersonation targets
  - apiGroups: [""]
    resources:
      - users
      - groups
      - serviceaccounts
      - userextras/*
    verbs: ["impersonate"]

  # Allow SelfSubjectAccessReviews
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create", "get", "list", "watch"]

  # Allow TokenReviews
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

  # Allow SubjectAccessReviews
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]

  # Allow updating status subresources for observedGeneration tracking
  - apiGroups: ["capsule.clastix.io"]
    resources:
      - proxysettings/status
      - globalproxysettings/status
    verbs: ["update", "patch"]

