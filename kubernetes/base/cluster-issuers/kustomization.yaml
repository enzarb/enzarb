# Let's Encrypt ClusterIssuers using DNS-01 through Cloudflare. The credentials Secret
# `cloudflare-api-token` (key api-token; a scoped token with Zone:DNS:Edit and Zone:Zone:Read on
# enzarb.dev) lives in the cert-manager namespace and is created out of band (mise run oldie:secrets), never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - letsencrypt.yaml
