[package]
name = "ez-tools"
description = "Built-in tools for the ez agent"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
globset = "0.4"
ignore = "0.4"
regex = "1"
ez-llm = { path = "../ez-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
