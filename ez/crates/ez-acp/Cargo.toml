[package]
name = "ez-acp"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
agent-client-protocol = { version = "3.4", default-features = false }
agent-client-protocol-schema = { version = "=1.12.0", default-features = false }
futures = "0.3"
anyhow = "1"
async-trait = "0.1"
ez-core = { path = "../ez-core" }
ez-mcp = { path = "../ez-mcp" }
ez-tools = { path = "../ez-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"

[dev-dependencies]
ez-llm = { path = "../ez-llm" }
tempfile = "3"
