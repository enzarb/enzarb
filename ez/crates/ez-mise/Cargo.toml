[package]
name = "ez-mise"
description = "mise task discovery and tool exposure for the ez agent"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
globset = "0.4"
ez-tools = { path = "../ez-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
