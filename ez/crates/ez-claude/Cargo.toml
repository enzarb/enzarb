[package]
name = "ez-claude"
description = "claude-code driver for ez: runs claude-agent-acp as a child and serves ez's tools to it over MCP"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
ez-llm = { path = "../ez-llm" }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tempfile = "3"
