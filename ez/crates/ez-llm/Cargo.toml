[package]
name = "ez-llm"
description = "LLM provider abstraction for ez (Anthropic + OpenAI-compatible)"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
