[package]
name = "ez-cli"
description = "`ez`: terminal UI and headless ACP client for ez"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[[bin]]
name = "ez"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures = "0.3"
ratatui = "0.30"
ez-acp = { path = "../ez-acp" }
ez-core = { path = "../ez-core" }
ez-llm = { path = "../ez-llm" }
ez-mcp = { path = "../ez-mcp" }
ez-mise = { path = "../ez-mise" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zeroize = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
