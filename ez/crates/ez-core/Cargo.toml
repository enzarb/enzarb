[package]
name = "ez-core"
description = "Agent loop, sessions, modes, permissions and config for ez"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "7"
globset = "0.4"
regex = "1"
ez-hooks = { path = "../ez-hooks" }
ez-claude = { path = "../ez-claude" }
ez-llm = { path = "../ez-llm" }
ez-mcp = { path = "../ez-mcp" }
ez-mise = { path = "../ez-mise" }
ez-tools = { path = "../ez-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = "0.25"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
