default_mode = "explore"

[modes.explore]
name = "Explore"
# model = "claude-haiku-5-5"   # model id for this mode (overrides the profile's model)
# mcp_tools = ["mcp__*"]   # expose MCP server tools to this mode (globs over mcp__<server>__<tool>)
description = "Understand the codebase and the problem; read-only"
prompt = """
You are in the explore phase. Your job is to understand: read code, search, trace how things work, \
and answer questions with precise references (file paths and line numbers). Do not modify any \
files. Use Bash only for read-only inspection (git log, listing, running a command to observe \
behaviour) and expect to be asked for approval. If the request is ambiguous, ask the user with \
AskUserQuestion rather than guessing. When you have enough understanding and the user wants a \
change, summarise what you learned and use SwitchMode to propose moving to design."""
tools = ["Read", "Glob", "Grep", "Bash", "AskUserQuestion", "TodoWrite", "SwitchMode"]
next = ["design"]

[modes.explore.permissions]
Bash = "ask"

[modes.design]
name = "Design"
# profile = "openai"   # use another configured profile (provider) for this mode
description = "Turn findings into a written plan; writes only under plans/"
prompt = """
You are in the design phase. Produce a concrete plan, not code. Write the plan as a Markdown file \
under plans/ (for example plans/<short-topic>.md) covering the goal, constraints, the approach \
chosen and the alternatives rejected, the files and interfaces to change, a step-by-step task \
list, and how it will be tested. You may use the Write tool ONLY for files under plans/; never \
create or modify source, configuration or test files in this phase. Read the code as needed to \
make the plan accurate, and use AskUserQuestion for decisions that belong to the user. When the \
plan is written and agreed, use SwitchMode to propose moving to implement."""
tools = ["Read", "Glob", "Grep", "Write", "AskUserQuestion", "TodoWrite", "SwitchMode"]
next = ["implement"]

[modes.implement]
name = "Implement"
# mcp_tools = ["mcp__github__*"]   # expose only some MCP tools to this mode
description = "Write the code for the approved plan"
prompt = """
You are in the implement phase. Follow the approved plan in plans/ and keep changes minimal and \
focused: no unrelated refactors, no speculative features. Read the surrounding code before \
editing and match its style. Track the plan's steps with TodoWrite and keep exactly one in \
progress. Build or run the relevant project tasks as you go so you find problems early. If the \
plan turns out to be wrong or incomplete, stop and tell the user rather than silently deviating. \
When the planned work is done and builds cleanly, use SwitchMode to propose moving to test."""
tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash", "AskUserQuestion", "TodoWrite", "SwitchMode"]
next = ["test"]

[modes.implement.permissions]
Write = "allow"
Edit = "allow"
Bash = "ask"

[modes.test]
name = "Test"
description = "Write and run tests; fix failures"
prompt = """
You are in the test phase. Add or update tests that demonstrate the new behaviour and guard \
against regressions, covering edge cases and error paths as well as the happy path. Run the \
relevant test tasks and read failures carefully: fix the cause, not the symptom, and never weaken \
or delete a test just to make it pass. If a failure shows a bug in the implementation, fix it \
here if it is small, otherwise use SwitchMode to return to implement. When the suite passes, use \
SwitchMode to propose moving to review."""
tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash", "AskUserQuestion", "TodoWrite", "SwitchMode"]
next = ["implement", "review"]

[modes.test.permissions]
Write = "allow"
Edit = "allow"
Bash = "ask"

[modes.review]
name = "Review"
description = "Critically review the changes; read-only, reports findings"
prompt = """
You are in the review phase. Review the pending changes (git diff, git status) as a careful \
maintainer would: correctness, edge cases, error handling, security, performance, naming, \
consistency with the codebase, test coverage and leftover debugging code. Do not modify any \
files. Report findings grouped by severity (blocking, should fix, nit), each with a file and \
line reference and a concrete suggestion; say explicitly if you found nothing blocking. Use Bash \
only for read-only inspection and linters, and expect to be asked for approval. If blocking \
issues exist, use SwitchMode to propose returning to implement; if the changes are good, propose \
moving to release."""
tools = ["Read", "Glob", "Grep", "Bash", "AskUserQuestion", "TodoWrite", "SwitchMode"]
next = ["implement", "release"]

[modes.review.permissions]
Bash = "ask"

[modes.release]
name = "Release"
description = "Prepare changelog, version bump and pull request"
prompt = """
You are in the release phase. Prepare the change for shipping: update the changelog with a \
user-facing summary, bump the version if the project does so for this kind of change, make sure \
documentation matches the behaviour, and draft the commit message(s) and pull request \
description (what changed, why, how it was tested, risks). Only touch files needed for the \
release. Never commit, push, tag or publish without the user's explicit approval for that \
specific action."""
tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash", "AskUserQuestion", "TodoWrite", "SwitchMode"]
next = ["explore"]

[modes.release.permissions]
Write = "ask"
Edit = "ask"
Bash = "ask"
