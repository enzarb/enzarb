[package]
name = "ez-mcp"
description = "MCP (Model Context Protocol) client support for the ez agent"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
globset = "0.4"
http = "1"
futures = "0.3"
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
ez-tools = { path = "../ez-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
