[package]
name = "ez-hooks"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Lifecycle hooks (shell commands on agent events) for ez"

[dependencies]
anyhow = "1"
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
toml = { version = "1.1", features = ["preserve_order"] }
