[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT"
repository = "https://github.com/enzarb/enzarb"

[workspace.dependencies]
agent-client-protocol = { version = "3.4", default-features = false }
agent-client-protocol-schema = { version = "=1.12.0", default-features = false }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
ratatui = "0.30"
regex = "1"
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

ez-acp = { path = "crates/ez-acp" }
ez-claude = { path = "crates/ez-claude" }
ez-core = { path = "crates/ez-core" }
ez-hooks = { path = "crates/ez-hooks" }
ez-llm = { path = "crates/ez-llm" }
ez-mcp = { path = "crates/ez-mcp" }
ez-mise = { path = "crates/ez-mise" }
ez-tools = { path = "crates/ez-tools" }

[profile.release]
# Fast builds over the last few percent of speed/size: no cross-crate LTO, parallel codegen.
lto = false
strip = true
