[package]
name = "enzarb-sandbox-operator"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "enzarb-sandbox-operator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
enzarb-crds = { path = "../enzarb-crds" }
futures = "0.3"
k8s-openapi = { version = "0.28", default-features = false, features = ["latest", "schemars"] }
kube = { version = "4.2", default-features = false, features = ["derive", "client", "runtime", "rustls-tls", "ring"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

