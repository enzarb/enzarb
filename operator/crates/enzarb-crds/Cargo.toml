[package]
name = "enzarb-crds"
version = "0.1.0"
edition.workspace = true
description = "enzarb Project CRD and generated upstream (agent-sandbox) types"

[dependencies]
k8s-openapi = { version = "0.28", default-features = false, features = ["latest", "schemars"] }
kube = { version = "4.2", default-features = false, features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"
