[package]
name = "enzarb-updater"
version = "0.1.0"
edition = "2024"

[lib]
name = "enzarb_updater"
path = "src/lib.rs"

[[bin]]
name = "enzarb-updater"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
hmac = "0.12"
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
