# Opt-in git hooks: `mise run hooks:install` once per clone (docs/dev.md, "Git hooks").
# Skip with `git commit --no-verify`, `git push --no-verify` or `LEFTHOOK=0`.
# Hooks only check, never modify files or install dependencies. Keep in sync with
# the CI jobs listed in docs/ci.md ("Git hooks").

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    cargo-deps:
      glob: "{Cargo.toml,Cargo.lock,rust-toolchain.toml,**/Cargo.toml,**/Cargo.lock,**/rust-toolchain.toml}"
      run: scripts/monorepo/check-cargo-deps.sh
    ui-lint:
      root: ui/
      glob: "*"
      run: '[ -d node_modules ] || { echo "ui: node_modules missing, running npm ci"; npm ci; }; npm run lint'
    graph-fresh:
      glob: "{Cargo.toml,**/Cargo.toml,**/package.json,scripts/monorepo/components.json,scripts/monorepo/gen-graph.sh,scripts/monorepo/graph.generated.sh}"
      run: scripts/monorepo/gen-graph.sh --check
    shellcheck:
      glob: "{.mise/tasks/**,.mise/lib/*.sh,.github/scripts/*.sh,scripts/**,*.sh}"
      run: shellcheck {staged_files}
    helm-lint:
      root: helm/
      glob: "*"
      run: mise run lint

# Only the components affected by the push (scripts/monorepo/affected.sh, the same graph the CI
# `changes` job uses, downstream components included) are checked; the per-component commands are
# in scripts/monorepo/pre-push.sh.
pre-push:
  commands:
    affected:
      run: scripts/monorepo/pre-push.sh
