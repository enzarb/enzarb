[workspace]
resolver = "3"
members = ["crates/enzarb-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/enzarb/enzarb-proto"

[workspace.dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
hex = "0.4"
