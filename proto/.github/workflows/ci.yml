name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Cargo.lock has no [patch] sections
        run: "! grep -q '^\\[\\[patch' Cargo.lock"

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: all
            flags: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo clippy --workspace --all-targets ${FLAGS:+$FLAGS} -- -D warnings

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: all
            flags: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: nextest
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo nextest run --workspace ${FLAGS:+$FLAGS}
      - name: doctests
        env:
          FLAGS: ${{ matrix.flags }}
        run: cargo test --workspace --doc ${FLAGS:+$FLAGS}

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `npm ci` runs `prepare`, which builds ts/ -> ts/dist with tsc.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: npm pack produces a working package
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npm pack --silent --pack-destination "$out"
          tarball="$(ls "$out"/*.tgz)"
          tar -tzf "$tarball" > "$out/list.txt"
          grep -q '^package/ts/dist/index.js$' "$out/list.txt"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          npm install --silent "$tarball"
          node --input-type=module -e "import('@enzarb/proto').then(m => { if (m.PROTOCOL_VERSION !== 1 || typeof m.Session !== 'function') process.exit(1); console.log('ok'); })"
