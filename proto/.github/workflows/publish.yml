name: publish
on:
  push:
    branches: [main]
    tags: ["v*"]

# One publish at a time per ref; never cancel a publish midway.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@enzarb"
      # `npm ci` runs `prepare`, which builds ts/ -> ts/dist with tsc.
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Compute version and dist-tag
        id: ver
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version.replace(/-.*/, '')")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tag=latest
          else
            version="${base}-main.${GITHUB_RUN_NUMBER}"
            tag=main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing @enzarb/proto@$version (dist-tag $tag)"

      - name: Skip if this version already exists
        id: exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if npm view "@enzarb/proto@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@enzarb/proto@${VERSION} already published; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.exists.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --tag "$TAG"
