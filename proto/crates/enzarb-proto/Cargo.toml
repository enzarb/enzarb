[package]
name = "enzarb-proto"
version = "0.1.0"
edition.workspace = true
license = "UNLICENSED"
repository = "https://github.com/enzarb/enzarb"
description = "enzarb mux protocol: frame codec, CTRL messages, credit-based flow control"

[lib]
name = "enzarb_proto"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "io-util", "macros", "time"], optional = true }
tokio-tungstenite = { version = "0.30.0", optional = true, default-features = false, features = ["connect", "handshake"] }
ts-rs = { version = "12", optional = true, features = ["serde-compat", "serde-json-impl"] }
schemars = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util", "io-util", "net"] }

[features]
default = []
# Async session runtime over a websocket (tokio-tungstenite message types).
tokio = ["dep:tokio", "dep:futures-util", "dep:tokio-tungstenite"]
# `Client::connect` to wss:// URLs (rustls, webpki roots).
tls = ["tokio", "tokio-tungstenite/rustls-tls-webpki-roots"]
# Derive TS types and JSON Schema for the CTRL frames; only `examples/gen_ts.rs` (mise run proto:gen) needs it.
codegen = ["dep:ts-rs", "dep:schemars"]

[[example]]
name = "gen_ts"
required-features = ["codegen"]
