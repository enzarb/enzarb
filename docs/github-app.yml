# GitHub App manifest for enzarb (contracts.md section 10).
# Used with the GitHub App manifest flow; see docs/dev.md "Create the GitHub App".
# GitHub expects JSON: convert with `npx --yes js-yaml docs/github-app.yml`.
#
# Replace the placeholders before use:
#   hook_attributes.url  your smee.io channel URL (dev) or https://<host>/hooks/github (prod)
#   url                  the app's homepage (any URL)
#   name                 must be unique on GitHub; its slug decides the bot login `<slug>[bot]`
#
# One App serves both jobs: webhooks/API access as the bot, and "Sign in with GitHub" for the UI.
# The UI only calls GET /user with the user-authorization token, so no separate OAuth App is
# needed. The App's Client ID and secret are the UI's GITHUB_OAUTH_CLIENT_ID/SECRET.
# callback_urls must contain <public>/login/github/callback for every host you sign in on.
# request_oauth_on_install stays off: the UI starts the login itself.
name: enzarb-dev
url: https://github.com/enzarb/enzarb
hook_attributes:
  url: https://smee.io/REPLACE-WITH-YOUR-CHANNEL
  active: true
# The manifest flow redirects here with ?code=... after creation. Nothing needs to listen:
# copy the code out of the address bar and exchange it with `gh api` (docs/dev.md).
redirect_url: http://localhost:3000/github-app-created
callback_urls:
  - https://enzarb.dev/login/github/callback
  - https://enzarb.local/login/github/callback
request_oauth_on_install: false
public: false
default_permissions:
  issues: write
  pull_requests: write
  contents: write
  checks: write
  metadata: read
default_events:
  - issues
  - issue_comment
  - pull_request
  - pull_request_review
  - pull_request_review_comment
  - installation
  - installation_repositories
