# The compiled `change_request` machine as a graph (ADR-0020, docs/workflows.md "Graph
# workflows"). Every new head is reviewed and the review posted. Must-fix findings and red CI
# are fixed automatically (3 rounds, then a person), merge conflicts get 2 attempts per base
# commit, and nothing merges until a person clicks Merge. Commit it as
# `.enzarb/workflows/change_request.yaml` on the default branch to use it.
#
# Conditions read the node's output first, then the item facts (`_item`): `review` (enzarb's
# verdict on the current head), `must_fix`, `ci` (success|failure|pending|unknown),
# `ci_fix_due` (CI failed on the reviewed head and no fix round ran for it), `mergeable`,
# `auto_rounds`, `head_sha`, `stacked`, `dependencies_open`.
version: 1
name: change_request
on: [change_request_opened]
start: review
nodes:
  review: {type: agent, prompt: review, max_visits: 50, on_limit: failed, next: post_review}
  post_review:
    type: action
    action: post_review
    max_visits: 50
    on_limit: failed
    next:
      must_fix: fix
      ci_fix_due: fix
      'review == "approve"': readiness
      else: human

  # Automatic rounds: enzarb's own findings or a red CI (with the failing logs).
  fix:
    type: agent
    prompt: address_comments
    max_visits: 3
    on_limit: capped
    next: {'decision == "blocked"': failed, pushed: review, else: readiness}
  # A person's comment or review.
  address:
    type: agent
    prompt: address_comments
    max_visits: 50
    on_limit: failed
    next: {'decision == "blocked"': failed, pushed: review, else: readiness}

  readiness:
    type: action
    action: check_merge_readiness
    max_visits: 100
    on_limit: human
    next:
      'review == "approve" && ci == "success" && mergeable': ready
      ci_fix_due: fix
      'ci == "failure"': ci_failed
      'review == "approve" && mergeable == false': unmergeable
      'review == "approve"': checks
      else: human

  # Approved; waiting for CI or for GitHub to say whether it merges.
  checks:
    type: wait
    events: [ci, conflict, pushed, comment, review]
    reason: ci_pending
    text: Waiting for CI
    max_visits: 100
    on_limit: human
    next:
      'event == "pushed"': review
      'event == "conflict"': resolve
      'event == "ci" && status == "failure"': fix
      'event == "ci"': readiness
      'event == "review" && state == "approved"': readiness
      else: address

  # Approved, CI green, mergeable: a person merges.
  ready:
    type: wait
    events: [merge_requested, pushed, ci, conflict, comment, review]
    max_visits: 100
    on_limit: human
    next:
      'event == "merge_requested"': merge_gate
      'event == "pushed"': review
      'event == "conflict"': resolve
      'event == "ci" && status == "failure"': fix
      'event == "ci"': readiness
      'event == "review" && state == "approved"': ready
      else: address
  # The click is stored, so this wait passes at once; only a wait on exactly
  # `merge_requested` may lead to a merge.
  merge_gate: {type: wait, events: [merge_requested], max_visits: 100, on_limit: human, next: merge}
  merge:
    type: action
    action: merge_change_request
    max_visits: 100
    on_limit: human
    next:
      'outcome == "merged" || outcome == "already_merged"': done
      'outcome == "head_moved" || outcome == "updated_branch"': review
      else: unmergeable

  # Waiting for a person.
  human:
    type: wait
    events: [comment, review, approval, pushed, conflict, ci]
    max_visits: 100
    on_limit: failed
    next:
      'event == "pushed"': review
      'event == "conflict"': resolve
      'event == "ci" && status == "failure"': fix
      'event == "ci"': human
      'event == "approval" || (event == "review" && state == "approved")': readiness
      else: address
  capped:
    type: wait
    events: [comment, review, approval, pushed, conflict]
    reason: round_limit
    max_visits: 100
    on_limit: failed
    next:
      'event == "pushed"': review
      'event == "conflict"': resolve
      'event == "approval" || (event == "review" && state == "approved")': readiness
      else: address
  ci_failed:
    type: wait
    events: [comment, review, approval, pushed, conflict, ci]
    reason: ci_failed
    max_visits: 100
    on_limit: failed
    next:
      'event == "pushed"': review
      'event == "conflict"': resolve
      'event == "ci" && status == "failure"': ci_failed
      'event == "ci" || event == "approval" || (event == "review" && state == "approved")': readiness
      else: address
  unmergeable:
    type: wait
    events: [conflict, pushed, comment, review, ci]
    reason: conflict_parked
    text: Conflicts or blocked by branch rules
    max_visits: 100
    on_limit: failed
    next:
      'event == "pushed"': review
      'event == "conflict"': resolve
      'event == "ci"': readiness
      else: address

  # Merge conflicts: merge the base into the branch (never a rebase), 2 attempts per base.
  resolve:
    type: agent
    prompt: resolve_conflicts
    max_visits: 50
    on_limit: parked
    next: {'decision == "blocked"': resolve_again, pushed: review, else: readiness}
  resolve_again:
    type: agent
    prompt: resolve_conflicts
    max_visits: 50
    on_limit: parked
    next: {'decision == "blocked"': tell_parked, pushed: review, else: readiness}
  tell_parked:
    type: action
    action: post_comment
    body: "enzarb could not resolve the merge conflict on its own and left this change request for a person. Comment here to try again after the conflict is resolved or the base moves on."
    max_visits: 50
    on_limit: parked
    next: parked
  parked:
    type: wait
    events: [comment, review, pushed, conflict]
    reason: conflict_parked
    max_visits: 100
    on_limit: failed
    next: {'event == "pushed"': review, else: resolve}

  failed: {type: end, status: failed}
  done: {type: end, status: done}
