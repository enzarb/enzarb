[workspace]
resolver = "3"
members = [
    "proto/crates/enzarb-proto",
    "operator/crates/enzarb-crds",
    "operator/crates/operator",
    "connectors/bin/receiver",
    "realtime",
    "sandbox-container",
    "sandbox-proxy",
    "updater",
    "tracks",
    "ez/crates/ez-acp",
    "ez/crates/ez-claude",
    "ez/crates/ez-cli",
    "ez/crates/ez-core",
    "ez/crates/ez-hooks",
    "ez/crates/ez-llm",
    "ez/crates/ez-mcp",
    "ez/crates/ez-mise",
    "ez/crates/ez-tools",
    "ez/crates/ez-workflow",
]

# Dependencies are declared per crate: the components release independently and
# their feature sets differ (docs/ci.md, "One Rust workspace").
[workspace.package]
edition = "2024"
