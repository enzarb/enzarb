# The only place tool versions are pinned (scripts/monorepo/check-tool-pins.sh enforces it):
# component mise.toml files hold tasks only, and Dockerfile ARG versions must equal the pins here.
# Ansible lives in mise.ansible.toml (MISE_ENV=ansible) so it is not built for every task.
[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"github:docker/buildx" = "0.38.0"
claude = "2.1.296"
gh = "2.76.2"
helm = "4.3.0"
jq = "1.7.1"
kind = "0.33.0"
kubeconform = "0.8.0"
kubectl = "1.34.0"
lefthook = "2.2.2"
node = "24.21.0"
npm = "12.2.0"
pnpm = "10.34.7"
"npm:cf" = "1.0.0-beta.14"
python = "3.13.16"
rust = "1.99.0"
shellcheck = "0.11.0"
yq = "4.54.1"
