[package]
name = "sandbox-init"
version = "0.1.0"
edition = "2024"
description = "enzarb sandbox pid-1: supervisor plus the enzarb-proto mux server"

[lib]
name = "sandbox_init"

[[bin]]
name = "sandbox-init"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
enzarb-proto = { path = "../proto/crates/enzarb-proto", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nix = { version = "0.30", features = ["signal", "process", "user", "fs"] }
portable-pty = "0.9"
subtle = "2"
thiserror = "2"
tokio-tungstenite = { version = "0.30.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
sha2 = "0.11.0"
serde_yaml_ng = "0.10.0"
agent-client-protocol = { version = "3.2", features = ["unstable_end_turn_token_usage"] }
tokio-util = { version = "0.7", features = ["compat"] }
jsonschema = { version = "0.58.6", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
