name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Cargo.lock has no [patch] sections
        run: "! grep -q '^\\[\\[patch' Cargo.lock"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Write build secret
        run: printf '%s\n' "$KEY" > "$RUNNER_TEMP/proto_key"
        env:
          KEY: ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: enzarb-sandbox:ci
          secret-files: |
            proto_key=${{ runner.temp }}/proto_key
      - run: scripts/smoke.sh enzarb-sandbox:ci
      - if: always()
        run: rm -f "$RUNNER_TEMP/proto_key"
