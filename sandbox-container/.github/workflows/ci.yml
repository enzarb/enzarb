name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Cargo.lock has no [patch] sections
        run: "! grep -q '^\\[\\[patch' Cargo.lock"

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      # The fake ACP agent in tests/fixtures is a node script.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --locked
      - run: cargo test --doc --locked

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/enzarb/enzarb-sandbox
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enzarb/enzarb-sandbox
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/enzarb/enzarb-sandbox-container
      - name: Build (load into local docker)
        run: |
          args=()
          while read -r l; do [ -z "$l" ] || args+=(--label "$l"); done <<< "$LABELS"
          cache_to=()
          if [ "$ON_MAIN" = true ]; then
            cache_to=(--cache-to "type=gha,mode=max,scope=enzarb-sandbox")
          fi
          docker buildx build "${args[@]}" \
            --cache-from "type=gha,scope=enzarb-sandbox" "${cache_to[@]}" \
            --secret id=proto_key,env=PROTO_KEY \
            --load -t enzarb-sandbox:ci .
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
          PROTO_KEY: ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
      - run: scripts/smoke.sh enzarb-sandbox:ci
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        if: env.PUSH == 'true'
        run: |
          while read -r t; do
            [ -z "$t" ] || { docker tag enzarb-sandbox:ci "$t"; docker push "$t"; }
          done <<< "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
