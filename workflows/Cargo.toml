[workspace]
resolver = "3"
members = ["crates/engine", "crates/enzarb-workflows"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
tracing = "0.1"
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hmac = "0.12"
sha2 = "0.10"
