name: image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enzarb/enzarb-workflows
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/enzarb/enzarb-workflows
      # Build secrets via the CLI (contracts §11): build-push-action `secrets:` mangles multi-line keys.
      - name: Build and push
        env:
          PROTO_KEY: ${{ secrets.ENZARB_PROTO_DEPLOY_KEY }}
          CRDS_KEY: ${{ secrets.ENZARB_CRDS_DEPLOY_KEY }}
          CONNECTORS_KEY: ${{ secrets.ENZARB_CONNECTORS_DEPLOY_KEY }}
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$TAGS"
          while IFS= read -r l; do [ -n "$l" ] && args+=(--label "$l"); done <<< "$LABELS"
          docker buildx build --push "${args[@]}" \
            --secret id=proto_key,env=PROTO_KEY \
            --secret id=crds_key,env=CRDS_KEY \
            --secret id=connectors_key,env=CONNECTORS_KEY .
