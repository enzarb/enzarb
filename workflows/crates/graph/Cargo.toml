[package]
name = "enzarb-graph"
version = "0.1.0"
# Explicit (not `workspace = true`): sandbox-container uses this crate as a
# path dependency and its Docker build copies only this directory.
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Graph workflow definitions (ADR-0020): schema, validation, conditions and advance. Pure: no IO."

[lib]
name = "enzarb_graph"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
