version: 1
agent:
  runtime: runtimes/fake
  model: test-model
  prompt: "Plan {{ subjects.issue.title }}"
result:
  as: plan
  schema: {type: object, required: [summary], properties: {summary: {type: string}}}
secrets: [API_KEY]
steer: [comment]
platform_wait:
  - kind: disk_full
    until: {platform: {fact: sandbox.disk_pct, op: lt, value: 85}}
