version: 1
id: ci-never-started
kind: dead_wait
severity: warning
text: "Waiting on CI at {node}, but the head has no check runs and mergeability is unknown"
when:
  all:
    - waiting_on: external
    - fact_count: {name: ci.check_runs, eq: 0}
    - any:
        - fact: {name: mergeable, is: unknown}
        - fact: {name: mergeable, is: false}
    - idle_for: {no_event: 30m}
