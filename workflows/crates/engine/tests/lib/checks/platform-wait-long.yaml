version: 1
id: platform-wait-long
kind: platform_failure
severity: warning
text: "Task {task} has waited on the platform at {node} for over an hour"
issue:
  title: "Task {task} has waited on the platform for over an hour"
  body: |
    Task {task} in project {project} ended a step at `{node}` with an environment failure
    (disk full, out of memory, ...) and has waited for the sandbox to recover for more than
    an hour with no event.

    Nothing was cancelled or woken early: the step resumes by itself when the condition clears
    (ADR-0026). Check the sandbox; the wait never times out.
  labels: [liveness, platform]
when:
  all:
    - platform_wait: {}
    - idle_for: {no_event: 1h}
