version: 1
id: event-failing
kind: event_failing
severity: warning
text: "Task {task} has an event failing (attempt {attempts}): {error}"
issue:
  title: "Task {task} has an event that keeps failing"
  body: |
    An event for task {task} in project {project} failed {attempts} times and is still being
    retried with backoff. Later events of the task wait behind it; other tasks are not affected.

    Last error: `{error}`

    The event is never dropped: it is applied once the cause is fixed.
  labels: [liveness, engine]
when:
  event_failing: {for: 5m}
