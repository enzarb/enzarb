version: 1
exits: [failed]
start: implement
nodes:
  implement:
    step: {use: steps/implement}
    next: [{if: "last.exit == 'success' and facts.git.pushed", to: open_pr}, {else: failed}]
  open_pr:
    action:
      name: open_pull_request
      args: {title: "Fix #{{ subjects.issue.number }}", body: "Closes #{{ subjects.issue.number }}"}
    next: [{if: "last.ok", to: ci}, {else: failed}]
  ci:
    wait:
      events: [{event: fact, if: "event.fact == 'ci'"}]
      refresh: [ci]
      reason: awaiting_ci
    next:
      - {if: "facts.ci.state == 'success'", to: merge}
  merge:
    action: {name: merge_pull_request, args: {title: "Fix #{{ subjects.issue.number }}"}}
    next: [{if: "last.ok", to: merged}, {else: failed}]
  merged:
    wait:
      events: [{event: pull_request, if: "event.merged"}]
      reason: awaiting_merge
    next: [{else: done}]
  done: {end: {status: done}}
  failed: {end: {status: failed}}
