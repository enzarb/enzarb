# Contract-test registry: every documented promise of a kernel action and the contract test
# that covers it. Format and rules: docs/workflows/contract-tests.md.
# Keep `entries` sorted by (action, kind, name).
version: 1
entries:
  - kind: action
    action: ci
    name: 'ci'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape, contract_tests::facts::ci_without_pr_is_null, contract_tests::facts::ci_ignore_regex_drops_matching_checks]
  - kind: result_field
    action: ci
    name: 'failing'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].actionable'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].conclusion'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].job_id'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].kind'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].log_excerpt'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].name'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].run_id'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'failing[].url'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'sha'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: result_field
    action: ci
    name: 'state'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::ci_shape]
  - kind: action
    action: create_issues
    name: 'create_issues'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::sub_issue_links_created, contract_tests::create_issues::depends_on_recorded_as_blocked_by, contract_tests::create_issues::placeholders_resolve_to_number_and_title, contract_tests::create_issues::retry_creates_no_duplicates, contract_tests::create_issues::duplicate_edge_422_is_absorbed, contract_tests::create_issues::transient_failure_then_retry_converges]
  - kind: arg
    action: create_issues
    name: 'body'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::placeholders_resolve_to_number_and_title]
  - kind: arg
    action: create_issues
    name: 'depends_on'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::depends_on_recorded_as_blocked_by]
  - kind: arg
    action: create_issues
    name: 'footer'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::placeholders_resolve_to_number_and_title]
  - kind: arg
    action: create_issues
    name: 'issues'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::dependencies_are_created_first, contract_tests::create_issues::result_shape_and_order]
  - kind: arg
    action: create_issues
    name: 'key'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::placeholders_resolve_to_number_and_title]
  - kind: arg
    action: create_issues
    name: 'labels'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::labels_are_passed_to_the_issue]
  - kind: arg
    action: create_issues
    name: 'parent'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::sub_issue_links_created, contract_tests::create_issues::sub_issue_parent_as_number, contract_tests::create_issues::no_parent_creates_no_sub_issue_link]
  - kind: arg
    action: create_issues
    name: 'title'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::placeholders_resolve_to_number_and_title]
  - kind: prompt_promise
    action: create_issues
    name: 'children_relate_to_result_issues'
    source: 'workflows/crates/engine/tests/stdlib/phases/breakdown.yaml (create: relate from result.issues)'
    tests: [contract_tests::create_issues::result_shape_and_order]
  - kind: prompt_promise
    action: create_issues
    name: 'sub_issues_wait_on_dependencies'
    source: 'workflows/crates/engine/tests/stdlib/steps/breakdown.yaml (create_issues takes the breakdown list)'
    tests: [contract_tests::create_issues::depends_on_recorded_as_blocked_by]
  - kind: result_field
    action: create_issues
    name: 'issues[].key'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::result_shape_and_order]
  - kind: result_field
    action: create_issues
    name: 'issues[].kind'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::result_shape_and_order]
  - kind: result_field
    action: create_issues
    name: 'issues[].number'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::result_shape_and_order]
  - kind: result_field
    action: create_issues
    name: 'issues[].repo'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::result_shape_and_order]
  - kind: result_field
    action: create_issues
    name: 'issues[].title'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::result_shape_and_order]
  - kind: result_field
    action: create_issues
    name: 'issues[].url'
    source: 'docs/workflows/contracts-v2.md#kernel-actions'
    tests: [contract_tests::create_issues::result_shape_and_order]
  - kind: action
    action: dependencies
    name: 'dependencies'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::dependencies_null_until_known, contract_tests::facts::dependencies_empty_list_once_known, contract_tests::facts::dependencies_reflect_blocked_by_edges, contract_tests::facts::dependencies_reflect_edges_recorded_by_create_issues]
  - kind: result_field
    action: dependencies
    name: '[]'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::dependencies_reflect_blocked_by_edges, contract_tests::facts::dependencies_reflect_edges_recorded_by_create_issues]
  - kind: action
    action: mergeable
    name: 'mergeable'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::mergeable_unknown_on_first_read, contract_tests::facts::mergeable_known_on_later_read, contract_tests::facts::mergeable_stays_unknown_when_seeded_none, contract_tests::facts::mergeable_null_without_pr]
  - kind: result_field
    action: mergeable
    name: 'value'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::mergeable_known_on_later_read, contract_tests::facts::mergeable_unknown_on_first_read]
  - kind: action
    action: reviews
    name: 'reviews'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::reviews_is_the_list, contract_tests::facts::reviews_empty_without_pr]
  - kind: result_field
    action: reviews
    name: '[].author'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::reviews_is_the_list]
  - kind: result_field
    action: reviews
    name: '[].body'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::reviews_is_the_list]
  - kind: result_field
    action: reviews
    name: '[].state'
    source: 'docs/workflows/contracts-v2.md#facts'
    tests: [contract_tests::facts::reviews_is_the_list]
