version: 1
description: >-
  Review the pull request until the bot approves it, CI is green and it is mergeable.
  Must-fix findings get automatic fix rounds (`max_rounds`), red GitHub Actions checks get
  fix rounds with their failing logs (`max_ci_rounds`; checks matching the `ci_ignore`
  regex never count), merge conflicts get `max_conflict_attempts` resolution attempts per
  base sha; after a cap a person decides. A person's comment or review is addressed and
  resets the fix rounds, and a new head pushed by someone else is re-reviewed. Every review
  after the first is a delta review from `vars.reviewed_sha`.
  Exits: `done` (ready to merge), `merged` (merged outside enzarb), `closed`.
params:
  review_prompt: {type: prompt, default: {file: prompts/review.md}}
  address_prompt: {type: prompt, default: {file: prompts/address.md}}
  ci_fix_prompt: {type: prompt, default: {file: prompts/ci_fix.md}}
  resolve_prompt: {type: prompt, default: {file: prompts/resolve_conflicts.md}}
  ci_ignore: {type: string, default: "(?i)copilot", description: Regex; failing checks whose name matches it never count}
  retry_command: {type: string, default: retry}
  max_rounds: {type: integer, default: 3}
  max_ci_rounds: {type: integer, default: 3}
  max_conflict_attempts: {type: integer, default: 2}
exits: [merged, closed]
start: init
nodes:
  init:
    set: {fix_rounds: 0}
    next: rounds
  rounds:
    phase:
      use: phases/review_rounds
      with:
        review_prompt: {param: review_prompt}
        address_prompt: {param: address_prompt}
        ci_fix_prompt: {param: ci_fix_prompt}
        resolve_prompt: {param: resolve_prompt}
        ci_ignore: {param: ci_ignore}
        retry_command: {param: retry_command}
        max_rounds: {param: max_rounds}
        max_ci_rounds: {param: max_ci_rounds}
        max_conflict_attempts: {param: max_conflict_attempts}
    max_visits: 50
    next:
      - {if: "exit == 'restart'", to: rounds}
      - {if: "exit == 'merged'", to: merged}
      - {if: "exit == 'closed'", to: closed}
      - {if: "exit == 'done'", to: done}
      - {else: limit}
  done: {end: {status: done}}
  merged: {end: {status: merged}}
  closed: {end: {status: closed}}
  limit: {end: {status: limit_reached}}
