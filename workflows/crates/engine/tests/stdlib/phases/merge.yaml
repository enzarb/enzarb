version: 1
description: >-
  Merge the pull request. `mode: human` (default) waits for a writer's Merge button or
  `/merge`; `mode: auto_when_green` merges as soon as CI is green and it is mergeable.
  The merge is pinned to the head CI passed on (`head_sha`), so a newer head is refused
  and goes back to review (exit `changed`), as does any new push.
params:
  mode: {type: enum, values: [human, auto_when_green], default: human}
  command: {type: string, default: merge}
  method: {type: enum, values: [squash, merge, rebase], default: squash}
  delete_branch: {type: boolean, default: true}
  retry_command: {type: string, default: retry}
  merge_label: {type: string, default: Merge}
  retry_label: {type: string, default: Retry}
  check_dependencies: {type: boolean, default: false, description: Re-check the issue's dependencies before merging (the issue workflow turns it on)}
  done_statuses: {type: list, items: string, default: [done, merged, released], description: End statuses that count as finished}
  unblock_command: {type: string, default: unblock}
exits: [changed, closed]
start: check
nodes:
  # Not (yet) green: no Merge button.
  check:
    wait:
      events: &events
        - {event: fact, if: "event.fact in ['ci', 'mergeable']"}
        - ci_status
        - check_run
        - {event: pull_request, if: "event.action in ['synchronize', 'closed']"}
        - {event: comment, from: writer, if: "event.command == params.command"}
      refresh: [ci, mergeable]
      reason: checking_merge
      text: "Checking CI and mergeability before the merge"
      column: review
      waiting_on: external
    max_visits: 500
    next: &next
      - {if: "event.type == 'pull_request' and event.action == 'closed' and event.merged", to: done}
      - {if: "event.type == 'pull_request' and event.action == 'closed'", to: closed}
      - {if: "event.type == 'pull_request'", to: changed}
      - {if: "event.type in ['ci_status', 'check_run']", to: check}
      - {if: "facts.ci.state == 'failure' or facts.mergeable == false", to: changed}
      - {if: "params.check_dependencies and facts.ci.state == 'success' and facts.mergeable and params.mode == 'auto_when_green'", to: verify}
      - {if: "params.check_dependencies and facts.ci.state == 'success' and facts.mergeable and event.type == 'comment'", to: verify}
      - {if: "facts.ci.state == 'success' and facts.mergeable and params.mode == 'auto_when_green'", to: merge}
      - {if: "facts.ci.state == 'success' and facts.mergeable and event.type == 'comment'", to: merge}
      - {if: "facts.ci.state == 'success' and facts.mergeable", to: ready}
  ready:
    wait:
      events: *events
      reason: ready_to_merge
      text: "Ready to merge: CI is green and {{ instance.bot.handle or 'enzarb' }} approved{{ ' (merging automatically)' if params.mode == 'auto_when_green' else '' }}"
      column: review
      waiting_on: human
      actions: [{label: {param: merge_label}, command: {param: command}}]
    max_visits: 500
    next: *next
  # The issue may have gained a dependency since it passed `dependencies`: before merging,
  # refresh the fact and wait until nothing it depends on is unfinished (`/unblock` merges anyway).
  verify:
    wait:
      events:
        - {event: fact, if: "event.fact == 'dependencies'"}
        - dependency_changed
        - {event: comment, from: writer, if: "event.command == params.unblock_command"}
        - {event: pull_request, if: "event.action in ['synchronize', 'closed']"}
      refresh: [dependencies]
      reason: blocked_by_dependencies
      text: "Waiting for the issues this one depends on to finish before merging"
      column: blocked
      waiting_on: external
      actions: [{label: Start anyway, command: {param: unblock_command}}]
    max_visits: 500
    next:
      - {if: "event.type == 'pull_request' and event.action == 'closed' and event.merged", to: done}
      - {if: "event.type == 'pull_request' and event.action == 'closed'", to: closed}
      - {if: "event.type == 'pull_request'", to: changed}
      - {if: "event.type == 'comment'", to: merge}
      - {if: "(facts.dependencies or []) | rejectattr('status', 'in', params.done_statuses) | list | length == 0", to: merge}
      - {if: "event.type == 'dependency_changed'", to: verify}
  merge:
    action:
      name: merge_pull_request
      args:
        number: "{{ (subjects.pull_requests | last).number }}"
        head_sha: "{{ facts.ci.sha }}"
        method: "{{ params.method }}"
        title: "{{ (subjects.pull_requests | last).title }}"
        delete_branch: "{{ params.delete_branch }}"
    max_visits: 10
    next:
      - {if: "last.ok", to: done}
      # A refused merge is `ok: false` with the reason in `result.error` (the only field the kernel
      # sets; enzarb#341 pins it): "head moved" (a newer head than CI passed on), or the
      # provider's text.
      - {if: "(last.result.error or '') | lower == 'head moved'", to: changed}
      # GitHub refuses a conflicted PR with only a message ("Pull Request has merge conflicts").
      - {if: "'conflict' in ((last.result.error or '') | lower)", to: changed}
      # Another merge landed between our check and this call: check again and merge.
      - {if: "'base branch was modified' in ((last.result.error or '') | lower)", to: check}
      - {else: failed}
  failed:
    wait:
      events:
        - {event: comment, from: writer, if: "event.command in [params.retry_command, params.command]"}
        - {event: pull_request, if: "event.action in ['synchronize', 'closed']"}
      reason: merge_failed
      text: "The merge failed{{ ': ' ~ last.result.error if last.result.error else '' }}; /retry to check again"
      column: blocked
      waiting_on: human
      actions: [{label: {param: retry_label}, command: {param: retry_command}}]
    next:
      - {if: "event.type == 'pull_request' and event.action == 'closed' and event.merged", to: done}
      - {if: "event.type == 'pull_request' and event.action == 'closed'", to: closed}
      - {if: "event.type == 'pull_request'", to: changed}
      - {else: check}
  # `vars.merged` lets the workflow tell a merge-closed issue from an abandoned one.
  done:
    set: {merged: true}
    end: {status: done}
  changed: {end: {status: changed}}
  closed: {end: {status: closed}}
