version: 1
description: >-
  Wait for a maintainer to start the work: a `/plan` comment, the `plan` label, or the
  "Start planning" button. Closing the issue ends the task (the workflow's handler).
params:
  command: {type: string, default: plan, description: Command word that starts the work}
  label: {type: string, default: plan, description: Label that starts the work}
  button: {type: string, default: Start planning, description: Label of the start button}
  check_dependencies: {type: boolean, default: false, description: Re-check the issue's dependencies before the command takes effect (the issue workflow turns it on)}
  done_statuses: {type: list, items: string, default: [done, merged, released], description: End statuses that count as finished}
  unblock_command: {type: string, default: unblock}
exits: [closed]
start: wait
nodes:
  wait:
    wait:
      events:
        - {event: comment, from: writer, if: "event.command == params.command"}
        - {event: label, from: writer, if: "event.action == 'added' and event.label == params.label"}
        - {event: issue, if: "event.action == 'closed'"}
      reason: awaiting_start
      text: "Comment /{{ params.command }}, add the `{{ params.label }}` label, or click {{ params.button }}"
      column: backlog
      waiting_on: human
      actions: [{label: {param: button}, command: {param: command}}]
    next:
      - {if: "event.type == 'issue'", to: closed}
      - {if: "params.check_dependencies", to: verify}
      - {else: done}
  # The sub-issue may have gained a dependency since it passed `dependencies`: before the
  # command takes effect, refresh the fact and wait until nothing it depends on is unfinished.
  verify:
    wait:
      events:
        - {event: fact, if: "event.fact == 'dependencies'"}
        - dependency_changed
        - {event: comment, from: writer, if: "event.command == params.unblock_command"}
        - {event: issue, if: "event.action == 'closed'"}
      refresh: [dependencies]
      reason: blocked_by_dependencies
      text: "Waiting for the issues this one depends on to finish"
      column: blocked
      waiting_on: external
      actions: [{label: Start anyway, command: {param: unblock_command}}]
    max_visits: 500
    next:
      - {if: "event.type == 'issue'", to: closed}
      - {if: "event.type == 'comment'", to: done}
      - {if: "facts.dependencies is not none and facts.dependencies | rejectattr('status', 'in', params.done_statuses) | list | length == 0", to: done}
      - {if: "event.type == 'dependency_changed'", to: verify}
  done: {end: {status: done}}
  closed: {end: {status: closed}}
