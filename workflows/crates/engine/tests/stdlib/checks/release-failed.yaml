version: 1
id: release-failed
kind: platform_failure
severity: warning
scope: platform
text: "The latest release run on main failed"
issue:
  repo: enzarb/enzarb
  title: "The release workflow failed on main"
  body: |
    The latest finished run of `release.yml` on `main` concluded with `failure`. Releases
    since that commit may be missing. Check the run in the Actions tab and re-run it once the
    cause is fixed.

    Nothing was cancelled or restarted; this issue only reports what the platform check read.
  labels: [platform, platform-failure]
when:
  platform: {fact: workflow_run.status, arg: "enzarb/enzarb:release.yml", op: eq, value: failure}
