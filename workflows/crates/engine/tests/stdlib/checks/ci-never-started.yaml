version: 1
id: ci-never-started
kind: dead_wait
severity: warning
text: "Waiting on CI at {node}, but the head has no check runs and mergeability is unknown or false"
issue:
  title: "Task {task} waits for CI that cannot start"
  body: |
    Task {task} in project {project} has waited at `{node}` for more than 30 minutes, but its
    head has no check runs and GitHub reports mergeability as unknown or `false`. A conflicting
    pull request never starts CI, so the events the task waits for cannot arrive.

    Nothing was cancelled or restarted. Resolve the conflict (or re-run the checks) and the
    task continues; this finding clears by itself once check runs appear.
  labels: [liveness, dead-wait]
when:
  all:
    - waiting_on: external
    - fact_count: {name: ci.check_runs, eq: 0}
    - any:
        - fact: {name: mergeable, is: unknown}
        - fact: {name: mergeable, is: false}
    - idle_for: {no_event: 30m}
