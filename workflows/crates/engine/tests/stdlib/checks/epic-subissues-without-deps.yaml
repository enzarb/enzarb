version: 1
id: epic-subissues-without-deps
kind: dead_wait
severity: info
text: "The epic's breakdown ordered this sub-issue after other work, but no dependency is recorded"
issue:
  title: "Sub-issue task {task}: the breakdown's dependencies were not recorded"
  body: |
    Task {task} in project {project} is a sub-issue of an epic. The epic's approved breakdown
    declared that it depends on other sub-issues (`depends_on`), but the task has no `blocked_by`
    dependency and has been waiting for more than 10 minutes at `{node}`. It can start before the
    work it needs.

    Nothing was cancelled or restarted. Add the missing "blocked by" links on GitHub.
    A sub-issue the breakdown declared independent never raises this.
  labels: [liveness, dead-wait]
when:
  all:
    - relation_count: {kind: parent, inbound: true, gt: 0}
    - declared_dependencies: {gt: 0}
    - relation_count: {kind: blocked_by, eq: 0}
    - idle_for: {no_event: 10m}
