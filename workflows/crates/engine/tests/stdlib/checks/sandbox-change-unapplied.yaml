version: 1
id: sandbox-change-unapplied
kind: platform_failure
severity: warning
scope: platform
text: "Sandbox {project} has a change it has not applied"
issue:
  repo: enzarb/enzarb
  title: "Sandbox of project {project} has not applied a pending change"
  body: |
    The sandbox of project `{project}` still has a pending change (an update of its spec that
    the sandbox has not rolled out) after two consecutive platform passes.

    Nothing was cancelled or restarted; this issue only reports what the platform check read.
  labels: [platform, platform-failure]
when:
  platform: {fact: project.pending_change, op: eq, value: true}
