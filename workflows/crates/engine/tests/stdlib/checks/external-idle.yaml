version: 1
id: external-idle
kind: dead_wait
severity: info
text: "Waiting on an external event at {node} for a day with no event and no step"
issue:
  title: "Task {task} has waited a day for an external event"
  body: |
    Task {task} in project {project} has waited on an external event at `{node}` for more than
    24 hours: no event reached it and no step ran.

    Nothing was cancelled or restarted. Check that what it waits for can still happen, then
    nudge it with a command or cancel it.
  labels: [liveness, dead-wait]
when:
  all:
    - waiting_on: external
    - idle_for: {no_event: 24h, no_step: 24h}
