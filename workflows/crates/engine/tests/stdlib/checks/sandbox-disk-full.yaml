version: 1
id: sandbox-disk-full
kind: platform_failure
severity: critical
scope: platform
text: "Sandbox {project} workspace is full"
issue:
  repo: enzarb/enzarb
  title: "Sandbox of project {project} has a full workspace"
  body: |
    The workspace of the sandbox of project `{project}` is at 100%. Steps that write to it
    fail until space is freed.

    Nothing was cancelled or restarted; this issue only reports what the platform check read.
  labels: [platform, platform-failure]
when:
  platform: {fact: sandbox.disk_pct, op: ge, value: 100}
