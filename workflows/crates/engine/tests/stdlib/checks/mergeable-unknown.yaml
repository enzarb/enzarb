version: 1
id: mergeable-unknown
kind: dead_wait
severity: info
text: "Mergeability is still unknown after several refreshes"
issue:
  title: "Task {task} cannot learn whether its pull request is mergeable"
  body: |
    Task {task} in project {project} (at `{node}`) refreshed the `mergeable` fact three times
    in a row and GitHub still answered "unknown". The task waits for a value that does not
    arrive.

    Nothing was cancelled or restarted. Check the pull request on GitHub (a stale or
    conflicting head often keeps mergeability unknown).
  labels: [liveness, dead-wait]
when:
  fact_unknown_for: {name: mergeable, refreshes: 3}
