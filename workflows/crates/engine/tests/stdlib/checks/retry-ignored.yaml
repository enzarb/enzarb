version: 1
id: retry-ignored
kind: dead_wait
severity: warning
text: "A command reached {node} 15 minutes ago and nothing happened"
issue:
  title: "Task {task} ignored a command at {node}"
  body: |
    A command (such as `/retry`) was sent to task {task} in project {project} more than 15
    minutes ago while it was at `{node}`, and the task has not moved or done anything since.

    Nothing was cancelled or restarted. The wait at this node may not act on the command; use
    the task's actions in the UI instead.
  labels: [liveness, dead-wait]
when:
  all:
    - node: review/rounds/checks
    - command_ignored: {for: 15m}
