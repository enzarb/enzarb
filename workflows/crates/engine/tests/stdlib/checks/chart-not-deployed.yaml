version: 1
id: chart-not-deployed
kind: platform_failure
severity: warning
scope: platform
text: "A released chart version failed to deploy"
issue:
  repo: enzarb/enzarb
  title: "A released chart version did not deploy"
  body: |
    The updater reports that the install of the desired chart version is failing (`stuck`: the
    helm-controller Job failed and the desired version is not the installed one). A rollout that
    is merely `pending` is normal and does not file. Check `GET /status` of the updater and the
    helm-controller Job of the `enzarb` HelmChart.

    Nothing was cancelled or restarted; this issue only reports what the platform check read.
  labels: [platform, platform-failure]
when:
  platform: {fact: chart.deploy_state, op: eq, value: stuck}
