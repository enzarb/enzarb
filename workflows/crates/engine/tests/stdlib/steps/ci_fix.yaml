version: 1
description: Fix the failing CI checks of the pull request head, from their logs (the executor pushes)
params:
  prompt: {type: prompt, default: {file: prompts/ci_fix.md}}
agent:
  runtime: runtimes/claude-code
  prompt: {param: prompt}
inputs:
  context: {from: outputs.context, type: object, required: false}
  failing: {from: facts.ci.failing, type: list}
result:
  as: ci_fix
  schema:
    type: object
    required: [decision, body]
    properties:
      decision: {type: string, enum: [done, blocked]}
      body: {type: string}
      checks: {type: array, items: {type: object}}
# Read-only Actions access so the agent can read the failed logs (`gh run view --log-failed`).
workspaces:
  - repo: "{{ task.repo }}"
    mode: write
    branch: "{{ (subjects.pull_requests | last).head or facts.git.branch }}"
    base: "{{ (subjects.pull_requests | last).base or task.default_branch }}"
github: {contents: write, actions: read, checks: read}
steer: [comment]
