version: 1
description: Merge the base branch into the pull request branch and resolve conflicts (never rebase)
params:
  prompt: {type: prompt, default: {file: prompts/resolve_conflicts.md}}
agent:
  runtime: runtimes/claude-code
  prompt: {param: prompt}
inputs:
  context: {from: outputs.context, type: object, required: false}
result:
  as: resolve
  schema:
    type: object
    required: [decision, body]
    properties:
      decision: {type: string, enum: [done, blocked]}
      body: {type: string}
workspaces:
  - repo: "{{ task.repo }}"
    mode: write
    branch: "{{ (subjects.pull_requests | last).head or facts.git.branch }}"
    base: "{{ (subjects.pull_requests | last).base or task.default_branch }}"
github: {contents: write}
steer: [comment]
platform_wait:
  - kind: disk_full
    until: {platform: {fact: sandbox.disk_pct, op: lt, value: 85}}
  - kind: oom
    until: {platform: {fact: sandbox.healthy, op: eq, value: true}}
