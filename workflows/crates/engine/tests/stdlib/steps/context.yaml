version: 1
description: >-
  Context the engine does not hold: the base branch head (`base_sha`), the merge base with it, the files the
  branch changes, and the affected components (`scripts/monorepo/affected.sh <merge base>`
  when the repository has it, else an empty list). Writes .enzarb/out/context.json.
params:
  base: {type: string, default: "", description: "Base branch; empty means the PR's base, else the default branch"}
command:
  # Values from GitHub reach the shell only through `shell_quote`.
  run: |
    set -eu
    mkdir -p .enzarb/out
    base={{ (params.base or (subjects.pull_requests | last).base or task.default_branch or "main") | shell_quote }}
    git fetch -q origin "$base" || true
    base_sha=$(git rev-parse "origin/$base" 2>/dev/null || true)
    mb=$(git merge-base HEAD "origin/$base" 2>/dev/null || true)
    head=$(git rev-parse HEAD)
    affected=""
    files=""
    if [ -n "$mb" ]; then
      files=$(git diff --name-only "$mb...HEAD" | head -n 300)
      if [ -x scripts/monorepo/affected.sh ]; then
        affected=$(scripts/monorepo/affected.sh "$mb" || true)
      fi
    fi
    jq -n --arg base "$base" --arg bs "$base_sha" --arg mb "$mb" --arg head "$head" --arg a "$affected" --arg f "$files" \
      '{base: $base, base_sha: $bs, merge_base: $mb, head: $head,
        affected: ($a | split("\n") | map(select(. != ""))),
        changed_files: ($f | split("\n") | map(select(. != "")))}' \
      > .enzarb/out/context.json
  tools: {mise: [jq@1.7.1]}
outputs:
  context: {file: .enzarb/out/context.json}
