version: 1
description: >-
  Run the repository's checks (`mise run check` when the task exists, else nothing).
  Exits `failure` when they fail; the tail of the log is kept as `checks_log`.
params:
  run: {type: command, default: "mise run check"}
command:
  run: |
    set -u
    mkdir -p .enzarb/out
    if ! mise tasks ls 2>/dev/null | awk '{print $1}' | grep -qx check; then
      echo "checks: no check task; skipped" > .enzarb/out/checks.log
      exit 0
    fi
    {{ params.run }} > .enzarb/out/checks.full.log 2>&1
    status=$?
    tail -n 200 .enzarb/out/checks.full.log > .enzarb/out/checks.log
    exit $status
outputs:
  checks_log: {file: .enzarb/out/checks.log, format: text, optional: true}
