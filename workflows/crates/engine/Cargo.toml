[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Postgres testcontainers fixture, reused by integration tests in later crates.
testing = ["dep:testcontainers-modules"]

[dependencies]
sqlx.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres"], optional = true }

[dev-dependencies]
engine = { path = ".", features = ["testing"] }
tokio.workspace = true
