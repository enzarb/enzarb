[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
# Postgres testcontainers fixture, reused by integration tests in later crates.
testing = ["dep:testcontainers-modules"]

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
tracing = "0.1"
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
enzarb-crds = { path = "../../../operator/crates/enzarb-crds" }
enzarb-connector = { path = "../../../connectors/crates/connector" }
enzarb-proto = { path = "../../../proto/crates/enzarb-proto", features = ["tokio"] }
enzarb-connector-github = { path = "../../../connectors/crates/connector-github" }
enzarb-flow = { path = "../flow" }
jsonschema = { version = "0.30", default-features = false }
base64 = "0.22"
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
sha2 = "0.10"
testcontainers-modules = { version = "0.15", features = ["postgres"], optional = true }
aes-gcm = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }

[dev-dependencies]
serde_yaml = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util", "net", "io-util"] }
engine = { path = ".", features = ["testing"] }
enzarb-connector = { path = "../../../connectors/crates/connector", features = ["fake"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
