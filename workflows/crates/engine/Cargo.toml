[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
# Postgres testcontainers fixture, reused by integration tests in later crates.
testing = ["dep:testcontainers-modules"]

[dependencies]
sqlx.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
kube.workspace = true
enzarb-crds = { git = "ssh://git@github.com/enzarb/enzarb-sandbox-operator.git", branch = "main" }
enzarb-connector = { git = "ssh://git@github.com/enzarb/enzarb-connectors.git", branch = "main" }
enzarb-proto = { git = "ssh://git@github.com/enzarb/enzarb-proto.git", branch = "main", features = ["tokio"] }
enzarb-connector-github = { git = "ssh://git@github.com/enzarb/enzarb-connectors.git", branch = "main" }
k8s-openapi.workspace = true
axum.workspace = true
hmac.workspace = true
sha2.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres"], optional = true }

[dev-dependencies]
engine = { path = ".", features = ["testing"] }
enzarb-connector = { git = "ssh://git@github.com/enzarb/enzarb-connectors.git", branch = "main", features = ["fake"] }
k8s-openapi.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
