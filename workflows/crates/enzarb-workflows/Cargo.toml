[package]
name = "enzarb-workflows"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "enzarb_workflows"
path = "src/lib.rs"

[[bin]]
name = "enzarb-workflows"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
enzarb-connector = { path = "../../../connectors/crates/connector" }
enzarb-connector-github = { path = "../../../connectors/crates/connector-github" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "chrono"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
engine = { path = "../engine", features = ["testing"] }