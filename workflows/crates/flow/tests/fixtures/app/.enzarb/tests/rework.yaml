name: a failing check loops back, /stop interrupts, a stall pauses
workflow: .enzarb/workflows/issue.yaml
start: {type: issue, action: opened, number: 7}
stubs:
  check: [{exit: failure}]
events:
  - event: {type: comment, body: /start, command: start, actor: {login: m, can_write: true}}
    expect: {at: work/implement, status: running}
  - step_finished: {exit: success, git: {pushed: true}}
    expect: {at: work/implement, effects: [run_step, run_step]}
  - event: {type: comment, body: "please also add a test", actor: {login: m}}
    expect: {effects: [steer]}
  - event: {type: comment, body: /stop, command: stop, actor: {login: m, can_write: true}}
    expect: {effects: [stop_step]}
  - step_finished: {exit: interrupted}
    expect: {at: gate/wait, status: waiting}
  - stall: true
    expect: {status: paused, projection: {column: stuck, needs_you: true}}
  - resume: true
    expect: {status: waiting}
  - event: {type: label, action: added, label: reject}
expect:
  status: ended:rejected
