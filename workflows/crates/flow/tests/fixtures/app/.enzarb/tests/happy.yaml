name: an approved issue is implemented, checked and released
workflow: .enzarb/workflows/issue.yaml
document:
  subjects:
    issue: {repo: acme/app, number: 7, title: Crash on start}
start: {type: issue, action: opened, number: 7}
stubs:
  work/implement:
    - exit: success
      git: {pushed: true}
      outputs: {summary: "Fixed the crash."}
  check: [{exit: success}]
events:
  - expect:
      at: gate/wait
      projection: {reason: awaiting_start, column: waiting, needs_you: true, actions: [Start], text: Waiting for /start}
  - event: {type: comment, body: /start, command: start, actor: {login: alice, can_write: false}}
    expect: {at: gate/wait, effects: []}
  - event: {type: comment, body: /start, command: start, actor: {login: maintainer, can_write: true}}
    expect:
      at: release/wait_release
      effects: [run_step, run_step, refresh_fact, set_timer]
      projection: {reason: awaiting_release, waiting_on: external, needs_you: false, artifacts: [Summary]}
  - event: {type: release, action: published, tag: v1.0.0}
expect:
  status: ended:done
  path: [gate/wait, gate/done, work/implement, work/check, work/done, release/wait_release, release/announce, release/done]
