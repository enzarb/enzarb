# Reference RBAC for the enzarb-workflows ServiceAccount (the Helm chart should template this).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enzarb-workflows
  namespace: enzarb
---
# Project is cluster-scoped: the reducer's project index lists/watches it, the
# executor reads status.sandbox.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enzarb-workflows-projects
rules:
  - apiGroups: ["enzarb.dev"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enzarb-workflows-projects
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enzarb-workflows-projects
subjects:
  - kind: ServiceAccount
    name: enzarb-workflows
    namespace: enzarb
---
# The executor reads each sandbox's auth Secret (named in Project.status.sandbox) to call
# sandbox-init (ADR-0013). All sandboxes live in one namespace (`enzarb-sandboxes`, chart value
# `sandbox.namespace`), so this is a namespaced Role there: `get` only (no list/watch). Secret
# names are per Project (`sb-<project>-auth`), so `resourceNames` cannot pin them; the namespace
# holds no other Secrets. Only roles that include `executor` need it. The RoleBinding subject
# stays in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enzarb-workflows-sandbox-secrets
  namespace: enzarb-sandboxes
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enzarb-workflows-sandbox-secrets
  namespace: enzarb-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enzarb-workflows-sandbox-secrets
subjects:
  - kind: ServiceAccount
    name: enzarb-workflows
    namespace: enzarb
