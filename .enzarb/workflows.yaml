# enzarb/enzarb's repo layer of the workflow bindings (ADR-0022). Everything is inherited from
# the standard library (enzarb/workflows@v1); only the `issues` binding is overridden.
#
# release_when stays empty (tasks end at merged) until the enzarb GitHub App subscribes to the
# `release` webhook event; then set it to [release.published] (component releases publish
# GitHub releases `<dir>/vX.Y.Z`).
version: 1
imports: {std: enzarb/workflows@v1}
bindings:
  - id: issues
    on: issue
    if: "event.action == 'opened'"
    use: std/workflows/issue
    with:
      release_when: []
      max_rounds: 4
      epic_allowed: "{{ relations | selectattr('kind', 'eq', 'parent') | list | length == 0 }}"
