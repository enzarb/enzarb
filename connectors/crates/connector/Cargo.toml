[package]
name = "enzarb-connector"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/enzarb/enzarb"
description = "Provider-neutral Connector trait and normalized event types for enzarb"

[features]
default = []
# In-memory FakeConnector for downstream tests.
fake = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
