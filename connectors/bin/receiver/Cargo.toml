[package]
name = "enzarb-receiver"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/enzarb/enzarb"
description = "GitHub webhook receiver: verifies the signature and logs each delivery in connectors.events"

[lib]
name = "enzarb_receiver"
path = "src/lib.rs"

[[bin]]
name = "receiver"
path = "src/main.rs"

[dependencies]
axum = "0.8"
hex = "0.4.3"
hmac = "0.13.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
