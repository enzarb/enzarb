[package]
name = "enzarb-receiver"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/enzarb/enzarb"
description = "GitHub webhook receiver: verifies, maps webhooks to the event catalog and hands them to engine_api.ingest"

[lib]
name = "enzarb_receiver"
path = "src/lib.rs"

[[bin]]
name = "receiver"
path = "src/main.rs"

[dependencies]
axum = "0.8"
aes-gcm = "0.10.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
enzarb-flow = { path = "../../../workflows/crates/flow" }
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
enzarb-connector-github = { version = "0.1.0", path = "../../crates/connector-github" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
