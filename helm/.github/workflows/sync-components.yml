name: sync-components
# Keeps enzarb/values.yaml on the latest release of every component. A component repo's release
# workflow dispatches `component-released`; the schedule is a safety net for a lost dispatch.
# The job reconciles ALL components (the payload is only a trigger), so concurrent or dropped
# dispatches cannot lose a bump.
on:
  repository_dispatch:
    types: [component-released]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
concurrency:
  group: sync-components
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    # Dormant until the repo variable RELEASE_ENABLED is "true" and ENZARB_RELEASE_TOKEN exists.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ENZARB_RELEASE_TOKEN }}
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: pip install jsonschema pyyaml
      - name: Sync component versions
        id: sync
        env:
          GH_TOKEN: ${{ secrets.ENZARB_RELEASE_TOKEN }}
        run: |
          scripts/sync-components.sh --message-file "$RUNNER_TEMP/msg"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Refresh goldens and run the chart checks
        if: steps.sync.outputs.changed == 'true'
        run: |
          scripts/golden.sh --update
          mise run test
      - name: Commit to main (the release workflow tags the next chart version from this commit)
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "enzarb-release[bot]"
          git config user.email "release@enzarb.dev"
          git add -A
          git commit -F "$RUNNER_TEMP/msg"
          git pull --rebase origin main
          # main may have moved while this ran: the goldens and templates must still agree.
          scripts/golden.sh
          git push origin HEAD:main
