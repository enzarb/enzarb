name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: pip install jsonschema pyyaml
      - run: mise run lint
      - run: mise run golden
      - run: mise run componentversions
      - run: mise run npmtoken
      - run: mise run kubeconform
      - run: mise run pgop
