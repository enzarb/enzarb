apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: clusters.pgop.ruck.io
spec:
  group: pgop.ruck.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is the Schema for the clusters API.
          It represents a PostgreSQL database cluster managed by the operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Cluster
            properties:
              image:
                default: postgres:18
                description: |-
                  image is the PostgreSQL container image to use.
                  Must be compatible with the official PostgreSQL image environment variables.
                type: string
              port:
                default: 5432
                description: port is the port PostgreSQL listens on
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              postgresMajorVersion:
                description: |-
                  postgresMajorVersion is the PostgreSQL major version of the image.

                  The operator uses this to pick the data-directory layout that matches the
                  official image conventions: PG <=17 stores data at /var/lib/postgresql/data,
                  while PG >=18 mounts /var/lib/postgresql and stores data at
                  /var/lib/postgresql/<major>/docker.

                  Normally this is auto-detected from the image tag (e.g. "postgres:18",
                  "postgis/postgis:16-3.4"). Set it explicitly when the tag does not encode a
                  parseable major version (e.g. "latest", a digest-pinned reference, or a
                  custom mirror); otherwise the reconcile fails rather than guess.
                format: int32
                minimum: 1
                type: integer
              replicas:
                default: 1
                description: |-
                  replicas is the number of PostgreSQL instances to run.
                  Currently only single instance is supported.
                format: int32
                maximum: 1
                minimum: 1
                type: integer
              resources:
                description: resources defines the compute resources for the PostgreSQL
                  container
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              storage:
                description: storage defines the persistent storage configuration
                properties:
                  retainPolicy:
                    default: Retain
                    description: |-
                      retainPolicy controls whether the PersistentVolumeClaim is kept or
                      deleted when the Cluster is deleted. Retain (the default) keeps the data,
                      so a Cluster recreated with the same name starts on the old volume.
                      Delete removes the PVC together with the Cluster. Delete requires
                      Kubernetes 1.27+ (StatefulSet persistentVolumeClaimRetentionPolicy).
                    enum:
                    - Retain
                    - Delete
                    type: string
                  size:
                    default: 1Gi
                    description: size is the size of the persistent volume claim
                    type: string
                  storageClassName:
                    description: storageClassName is the name of the StorageClass
                      to use
                    type: string
                type: object
              tls:
                description: |-
                  tls enables TLS on the PostgreSQL server. When unset (the default) the
                  server runs without TLS and the operator connects with sslmode=disable,
                  exactly as before TLS support existed.
                properties:
                  issuerRef:
                    description: |-
                      issuerRef makes the operator create and own a cert-manager Certificate
                      "<cluster>-server" issued by this issuer. cert-manager writes the
                      certificate to the Secret "<cluster>-server-tls", which is then used
                      exactly like secretName. The issuer must populate ca.crt (CA, Vault and
                      self-signed issuers do). Requires cert-manager; without it the Cluster
                      reports TLSReady=False with reason CertManagerUnavailable. Mutually
                      exclusive with secretName.
                    properties:
                      group:
                        default: cert-manager.io
                        description: |-
                          group of the issuer. Defaults to cert-manager.io; set it for external
                          issuers.
                        type: string
                      kind:
                        default: Issuer
                        description: |-
                          kind of the issuer: Issuer (namespaced, in the Cluster namespace),
                          ClusterIssuer, or the kind of an external issuer.
                        type: string
                      name:
                        description: name of the issuer.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  minProtocolVersion:
                    default: TLSv1.2
                    description: |-
                      minProtocolVersion is the minimum TLS protocol version the server accepts
                      (PostgreSQL ssl_min_protocol_version).
                    enum:
                    - TLSv1.2
                    - TLSv1.3
                    type: string
                  requireTLS:
                    default: true
                    description: |-
                      requireTLS rejects non-TLS TCP connections through an operator-managed
                      pg_hba.conf (hostnossl ... reject). Connections over the local Unix
                      socket (probes, the postStart hook) are unaffected. Defaults to true.
                    type: boolean
                  secretName:
                    description: |-
                      secretName is the name of a Secret in the Cluster namespace holding the
                      server certificate in the kubernetes.io/tls layout: tls.crt (server
                      certificate, optionally followed by intermediates), tls.key (private key)
                      and ca.crt (the CA that issued tls.crt). cert-manager Certificate
                      resources produce this layout. The certificate must be valid for the
                      Service DNS name <cluster>.<namespace>.svc.cluster.local, which the
                      operator verifies with sslmode=verify-full. Mutually exclusive with
                      issuerRef.
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: secretName and issuerRef are mutually exclusive; set at
                    most one (neither selects the self-managed CA)
                  rule: '!(has(self.secretName) && has(self.issuerRef))'
            type: object
          status:
            description: status defines the observed state of Cluster
            properties:
              conditions:
                description: conditions represent the current state of the Cluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
