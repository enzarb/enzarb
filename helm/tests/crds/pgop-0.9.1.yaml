                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobName:
                description: jobName is the name of the Kubernetes Job executing this
                  backup
                type: string
              location:
                description: location is the destination path of the completed backup
                  artifact
                type: string
              phase:
                description: phase is the current execution phase
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              sizeBytes:
                description: sizeBytes is the size of the backup artifact in bytes
                format: int64
                type: integer
              startTime:
                description: startTime is when the backup job started
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

