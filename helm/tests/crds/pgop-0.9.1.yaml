                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              databaseRef:
                description: databaseRef references the Database to back up (required
                  for logical backups)
                properties:
                  name:
                    description: name is the name of the Cluster resource in the same
                      namespace
                    type: string
                required:
                - name
                type: object
              destination:
                description: destination configures where backups are stored
                properties:
                  azure:
                    description: azure configures Azure Blob Storage
                    properties:
                      container:
                        description: container is the Azure Blob container name
                        type: string
                      credentialsSecretRef:
                        description: |-
                          credentialsSecretRef references a Secret with Azure credentials.
                          Key: AZURE_STORAGE_KEY or AZURE_CLIENT_SECRET etc.
                          If omitted, workload identity is used.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
