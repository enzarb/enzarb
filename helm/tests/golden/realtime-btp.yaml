apiVersion: pgop.ruck.io/v1alpha1
kind: Database
metadata:
  name: enzarb
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: enzarb-postgres
    app.kubernetes.io/instance: enzarb
    app.kubernetes.io/part-of: enzarb
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: enzarb-0.0.0
spec:
  clusterRef:
    name: enzarb-pg
  databaseName: enzarb
  # Database.owner is a Role resource name.
  owner: workflows-owner
  # schemas[].owner and grants[].role are raw PostgreSQL role names. Object-level grants
  # (views, functions, default privileges) are written by each owner's migrations.
  schemas:
    - name: workflows
      owner: enzarb_workflows_owner
      grants:
        - { role: enzarb_workflows, privileges: [USAGE] }
    - name: workflows_api
      owner: enzarb_workflows_owner
      grants:
        - { role: enzarb_workflows, privileges: [USAGE] }
        - { role: enzarb_connectors, privileges: [USAGE] }
        - { role: enzarb_ui, privileges: [USAGE] }
    - name: connectors
      owner: enzarb_connectors_owner
      grants:
        - { role: enzarb_connectors, privileges: [USAGE] }
        - { role: enzarb_workflows, privileges: [USAGE] }
    - name: app
      owner: enzarb_ui_owner
      grants:
        - { role: enzarb_ui, privileges: [USAGE] }
    - name: app_api
      owner: enzarb_ui_owner
      grants:
        - { role: enzarb_ui, privileges: [USAGE] }
        - { role: enzarb_workflows, privileges: [USAGE] }
        - { role: enzarb_sandbox_proxy, privileges: [USAGE] }

