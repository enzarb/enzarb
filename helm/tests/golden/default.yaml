---
# Source: enzarb/templates/sandbox-namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: enzarb-sandboxes
  labels:
    app.kubernetes.io/name: enzarb-sandboxes
    app.kubernetes.io/instance: enzarb
    app.kubernetes.io/part-of: enzarb
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: enzarb-0.0.0
    # Pod Security: privileged. dockerd (run by sandbox-init in the sandbox container) needs
    # root and SYS_ADMIN/NET_ADMIN under gVisor, and the kata profile is privileged
    # (ADR-0016); gVisor is the isolation boundary. Explicit
    # label so a stricter cluster default cannot reject sandbox pods.
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    # Keep on `helm uninstall`: the namespace holds every Project's workspace and docker
    # volumes, so removing the chart must not delete user data. Delete it by hand.
    helm.sh/resource-policy: keep

---
# Source: enzarb/templates/sandbox-namespace.yaml
# Namespace-wide default deny. The operator adds an allow policy per Project (sb-<project>).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: enzarb-sandboxes
  labels:
    app.kubernetes.io/name: enzarb-sandboxes
    app.kubernetes.io/instance: enzarb
    app.kubernetes.io/part-of: enzarb
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: enzarb-0.0.0
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# Source: enzarb/templates/sandbox-namespace.yaml
# Defaults for containers that set no resources; per-Project limits come from the pod itself.
apiVersion: v1
kind: LimitRange
metadata:
  name: enzarb-sandbox-defaults
  namespace: enzarb-sandboxes
  labels:
    app.kubernetes.io/name: enzarb-sandboxes
    app.kubernetes.io/instance: enzarb
    app.kubernetes.io/part-of: enzarb
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: enzarb-0.0.0
spec:
  limits:
    - type: Container
      default:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi

