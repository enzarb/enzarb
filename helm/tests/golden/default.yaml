# Source: enzarb/templates/sandbox-namespace.yaml
# Created with the release, so it exists before any Sandbox (the operator never creates it).
# Sandbox pods run as this ServiceAccount: no token mounted and no Role/RoleBinding, so
# sandboxes have no Kubernetes API access. Future access is limited to other namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enzarb-sandbox
  namespace: enzarb-sandboxes
  labels:
    app.kubernetes.io/name: enzarb-sandbox
    app.kubernetes.io/instance: enzarb
    app.kubernetes.io/part-of: enzarb
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: enzarb-0.0.0
automountServiceAccountToken: false

