{{- $c := .Values.operator }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enzarb-sandbox-operator
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  {{- include "enzarb.rollout" $c | nindent 2 }}
  selector:
    matchLabels:
      {{- include "enzarb.selector" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 8 }}
    spec:
      serviceAccountName: enzarb-sandbox-operator
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- include "enzarb.pullSecrets" . | nindent 6 }}
      containers:
        - name: operator
          image: {{ include "enzarb.image" $c }}
          imagePullPolicy: {{ include "enzarb.pullPolicy" (dict "ctx" . "c" $c) }}
          ports:
            - { name: health, containerPort: 8080 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: ENZARB_RELEASE_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: ENZARB_SANDBOX_NAMESPACE, value: {{ .Values.sandbox.namespace | quote }} }
            - { name: ENZARB_SANDBOX_SERVICE_ACCOUNT, value: {{ .Values.sandbox.serviceAccount | quote }} }
            - { name: ENZARB_SANDBOX_EGRESS_EXCLUDE_CIDRS, value: {{ join "," (required "sandbox.egress.clusterCIDRs is required: set the cluster's pod, service and node CIDRs (they contain the API server endpoint); sandbox egress on 443 excludes them" (.Values.sandbox.egress.clusterCIDRs | join "," | default "" | splitList "," | compact | default nil)) | quote }} }
            {{- with .Values.sandbox.dnsCIDRs }}
            - { name: ENZARB_SANDBOX_DNS_CIDRS, value: {{ join "," . | quote }} }
            {{- end }}
            - { name: ENZARB_SANDBOX_IMAGE, value: {{ $c.sandboxImage | quote }} }
            - { name: ENZARB_DEFAULT_STORAGE, value: {{ $c.defaultStorage | quote }} }
            - { name: ENZARB_SANDBOX_RUNTIME_CLASS, value: {{ $c.sandboxRuntimeClass | quote }} }
            - { name: ENZARB_DOCKER_RUNTIME_CLASSES, value: {{ join "," $c.docker.runtimeClasses | quote }} }
            - { name: ENZARB_DOCKER_STORAGE, value: {{ $c.docker.storage | quote }} }
            {{- with $c.docker.prune }}
            - { name: ENZARB_DOCKER_PRUNE, value: {{ ternary "on" "off" (.enabled | default false) | quote }} }
            - { name: ENZARB_DOCKER_PRUNE_AGE, value: {{ .age | quote }} }
            - { name: ENZARB_DOCKER_PRUNE_MIN_FREE, value: {{ .minFree | quote }} }
            {{- end }}
            {{- if $c.docker.profiles }}
            - { name: ENZARB_DOCKER_PROFILES_FILE, value: /etc/enzarb/docker/profiles.yaml }
            {{- end }}
            {{- /* tracks pods reach sandboxes the way the proxy does when tracks executes runs. */}}
            {{- $names := $c.netpolIngressPodNames }}
            {{- if include "enzarb.tracksExecutor" . }}
            {{- if not $names }}{{ $names = "enzarb-sandbox-proxy" }}{{ end }}
            {{- if not (has "enzarb-tracks" (splitList "," $names)) }}{{ $names = printf "%s,enzarb-tracks" $names }}{{ end }}
            {{- end }}
            {{- with $names }}
            - { name: ENZARB_NETPOL_INGRESS_POD_NAMES, value: {{ . | quote }} }
            {{- end }}
            - { name: RUST_LOG, value: {{ .Values.rustLog | quote }} }
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          {{- with include "enzarb.preStop" $c }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $c.docker.profiles }}
          volumeMounts:
            - { name: docker-profiles, mountPath: /etc/enzarb/docker, readOnly: true }
          {{- end }}
          securityContext: {{ include "enzarb.securityContext" (dict "ctx" . "uid" 65532) | fromYaml | toJson }}
      {{- if $c.docker.profiles }}
      volumes:
        - name: docker-profiles
          configMap: { name: enzarb-sandbox-operator-docker-profiles }
      {{- end }}
{{- if $c.docker.profiles }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: enzarb-sandbox-operator-docker-profiles
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 4 }}
data:
  profiles.yaml: |
    {{- toYaml $c.docker.profiles | nindent 4 }}
{{- end }}
