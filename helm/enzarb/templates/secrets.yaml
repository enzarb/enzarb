{{- $jwt := not .Values.secrets.sessionJwt.existingSecret }}
{{- $rt := and .Values.realtime.enabled (not .Values.secrets.realtimeJwt.existingSecret) }}
{{- if or $jwt $rt }}
{{- /* Generated once, then kept: lookup reads the live Secret on upgrade. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "enzarb.generatedSecret" .)) | default dict }}
{{- $old := get $existing "data" | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enzarb.generatedSecret" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb") | nindent 4 }}
type: Opaque
data:
  {{- if $jwt }}
  session-jwt-secret: {{ get $old "session-jwt-secret" | default (randAlphaNum 48 | b64enc) }}
  {{- end }}
  {{- if $rt }}
  realtime-jwt-secret: {{ get $old "realtime-jwt-secret" | default (randAlphaNum 48 | b64enc) }}
  {{- end }}
---
{{- end }}
{{- if not .Values.secrets.github.existingSecret }}
{{- $g := .Values.secrets.github }}
apiVersion: v1
kind: Secret
metadata:
  name: enzarb-github
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb") | nindent 4 }}
type: Opaque
stringData:
  {{ $g.keys.appId }}: {{ $g.appId | toString | quote }}
  {{ $g.keys.privateKey }}: {{ $g.privateKey | quote }}
  {{ $g.keys.webhookSecret }}: {{ $g.webhookSecret | quote }}
  {{ $g.keys.oauthClientId }}: {{ $g.oauthClientId | quote }}
  {{ $g.keys.oauthClientSecret }}: {{ $g.oauthClientSecret | quote }}
{{- end }}
