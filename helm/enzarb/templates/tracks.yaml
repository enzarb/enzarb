{{- if .Values.tracks.enabled }}
{{- $c := .Values.tracks }}
{{- $routing := include "enzarb.tracksRouting" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enzarb-tracks
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-tracks") | nindent 4 }}
spec:
  # The API is stateless; routing is safe with several replicas (each event is decided once, by
  # the primary key of tracks.event_decisions), though one is plenty.
  replicas: {{ $c.replicaCount }}
  {{- include "enzarb.rollout" $c | nindent 2 }}
  selector:
    matchLabels:
      {{- include "enzarb.selector" (dict "ctx" . "name" "enzarb-tracks") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-tracks") | nindent 8 }}
    spec:
      serviceAccountName: enzarb-tracks
      # Routing reads Project CRs through the API server; without it tracks needs no API access.
      automountServiceAccountToken: {{ if $routing }}true{{ else }}false{{ end }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- include "enzarb.pullSecrets" . | nindent 6 }}
      {{- if $routing }}
      {{- include "enzarb.waitMigrations" . | nindent 6 }}
      {{- end }}
      containers:
        - name: tracks
          image: {{ include "enzarb.image" $c }}
          imagePullPolicy: {{ include "enzarb.pullPolicy" (dict "ctx" . "c" $c) }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "enzarb.secretEnv" (dict "name" "ENZARB_TRACKS_TOKEN" "secret" (include "enzarb.tracksTokenSecret" .) "key" (include "enzarb.tracksTokenKey" .)) | nindent 12 }}
            {{- if $routing }}
            {{- include "enzarb.dbEnv" (dict "ctx" . "role" "tracks") | nindent 12 }}
            {{- include "enzarb.secretEnv" (dict "name" "ENZARB_GITHUB_APP_ID" "optional" true "secret" (include "enzarb.githubSecret" .) "key" (include "enzarb.githubKey" (dict "ctx" . "key" "appId"))) | nindent 12 }}
            {{- include "enzarb.secretEnv" (dict "name" "ENZARB_GITHUB_APP_PRIVATE_KEY" "optional" true "secret" (include "enzarb.githubSecret" .) "key" (include "enzarb.githubKey" (dict "ctx" . "key" "privateKey"))) | nindent 12 }}
            - { name: ENZARB_TRACKS_ROUTING, value: "true" }
            - { name: ENZARB_TRACKS_CONCURRENCY, value: {{ $c.routing.concurrency | quote }} }
            {{- end }}
            - { name: RUST_LOG, value: {{ .Values.rustLog | quote }} }
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          {{- with include "enzarb.preStop" $c }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{ include "enzarb.securityContext" (dict "ctx" . "uid" 10001) | fromYaml | toJson }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: enzarb-tracks
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-tracks") | nindent 4 }}
spec:
  selector:
    {{- include "enzarb.selector" (dict "ctx" . "name" "enzarb-tracks") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
