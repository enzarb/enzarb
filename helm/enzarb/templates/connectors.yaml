{{- $c := .Values.connectors }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enzarb-connectors
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-connectors") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  {{- include "enzarb.rollout" $c | nindent 2 }}
  selector:
    matchLabels:
      {{- include "enzarb.selector" (dict "ctx" . "name" "enzarb-connectors") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-connectors") | nindent 8 }}
    spec:
      serviceAccountName: enzarb-connectors
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- include "enzarb.pullSecrets" . | nindent 6 }}
      {{- include "enzarb.waitMigrations" . | nindent 6 }}
      containers:
        - name: receiver
          image: {{ include "enzarb.image" $c }}
          imagePullPolicy: {{ include "enzarb.pullPolicy" (dict "ctx" . "c" $c) }}
          args: [serve]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "enzarb.dbEnv" (dict "ctx" . "role" "connectors") | nindent 12 }}
            {{- include "enzarb.secretEnv" (dict "name" "ENZARB_SECRETS_KEY" "secret" (include "enzarb.secretsKeySecret" .) "key" (include "enzarb.secretsKeyKey" .)) | nindent 12 }}
            {{- include "enzarb.secretEnv" (dict "name" "GITHUB_WEBHOOK_SECRET" "secret" (include "enzarb.githubSecret" .) "key" (include "enzarb.githubKey" (dict "ctx" . "key" "webhookSecret"))) | nindent 12 }}
            {{- include "enzarb.secretEnv" (dict "name" "GITHUB_APP_ID" "optional" true "secret" (include "enzarb.githubSecret" .) "key" (include "enzarb.githubKey" (dict "ctx" . "key" "appId"))) | nindent 12 }}
            {{- include "enzarb.secretEnv" (dict "name" "GITHUB_APP_PRIVATE_KEY" "optional" true "secret" (include "enzarb.githubSecret" .) "key" (include "enzarb.githubKey" (dict "ctx" . "key" "privateKey"))) | nindent 12 }}
            - { name: RECEIVER_LISTEN, value: 0.0.0.0:8080 }
            - { name: ENZARB_BOT_HANDLE, value: {{ $c.botHandle | quote }} }
            - { name: ENZARB_BOT_LOGIN, value: {{ $c.botLogin | quote }} }
            - { name: RUST_LOG, value: {{ .Values.rustLog | quote }} }
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          {{- with include "enzarb.preStop" $c }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{ include "enzarb.securityContext" (dict "ctx" . "uid" 10001) | fromYaml | toJson }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: enzarb-connectors
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-connectors") | nindent 4 }}
spec:
  selector:
    {{- include "enzarb.selector" (dict "ctx" . "name" "enzarb-connectors") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
