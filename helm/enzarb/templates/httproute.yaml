{{- if .Values.route.enabled }}
{{- $parent := dict "name" .Values.gateway.name "namespace" .Values.gateway.namespace }}
{{- /* The three prefixes share one host. The Gateway (Envoy) sets X-Forwarded-Proto, which the ui's
       PROTOCOL_HEADER relies on for its CSRF origin check. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: enzarb-ui
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-ui") | nindent 4 }}
spec:
  parentRefs:
    - {{ toYaml $parent | nindent 6 | trim }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: enzarb-ui, port: 3000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: enzarb-sandbox-proxy
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-proxy") | nindent 4 }}
spec:
  parentRefs:
    - {{ toYaml $parent | nindent 6 | trim }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /sandbox/ }
      # Websocket upgrades pass through; do not time the long-lived stream out.
      timeouts:
        request: {{ .Values.route.sandboxRequestTimeout | quote }}
      backendRefs:
        - { name: enzarb-sandbox-proxy, port: 8080 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: enzarb-connectors
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-connectors") | nindent 4 }}
spec:
  parentRefs:
    - {{ toYaml $parent | nindent 6 | trim }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /hooks/ }
      backendRefs:
        - { name: enzarb-connectors, port: 8080 }
{{- if and .Values.updater.enabled .Values.updater.webhook.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: enzarb-updater
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
spec:
  parentRefs:
    - {{ toYaml $parent | nindent 6 | trim }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /updater/hook }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /hook }
      backendRefs:
        - { name: enzarb-updater, port: {{ .Values.updater.port }} }
{{- end }}
{{- if .Values.route.backendTrafficPolicy.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: enzarb-sandbox-proxy
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-proxy") | nindent 4 }}
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: enzarb-sandbox-proxy }
  timeout:
    http:
      connectionIdleTimeout: {{ .Values.route.backendTrafficPolicy.connectionIdleTimeout | quote }}
{{- end }}
{{- end }}
