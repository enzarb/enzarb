{{- if .Values.secrets.claudeKey.rekey.enabled }}
{{- /* Manual only (not a hook): re-encrypts stale per-user Claude tokens with the active key.
       Reads the keyring, never edits it, and has no Kubernetes API access. Job specs are
       immutable, so every run needs a new rekey.suffix (`mise run rekey` sets one). */}}
{{- $c := .Values.sandboxProxy }}
apiVersion: batch/v1
kind: Job
metadata:
  name: enzarb-claude-rekey-{{ required "secrets.claudeKey.rekey.suffix is required when rekey.enabled" .Values.secrets.claudeKey.rekey.suffix }}
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-claude-rekey") | nindent 4 }}
spec:
  backoffLimit: {{ .Values.secrets.claudeKey.rekey.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.secrets.claudeKey.rekey.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-claude-rekey") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "enzarb.pullSecrets" . | nindent 6 }}
      # the keyring files are root-owned; fsGroup makes them group-readable by the non-root uid
      securityContext: { fsGroup: 65532 }
      containers:
        - name: rekey
          image: {{ include "enzarb.image" $c }}
          imagePullPolicy: {{ include "enzarb.pullPolicy" (dict "ctx" . "c" $c) }}
          args: [rekey]
          env:
            {{- include "enzarb.dbEnv" (dict "ctx" . "role" "sandbox-proxy") | nindent 12 }}
            {{- include "enzarb.claudeKeyEnv" . | nindent 12 }}
            - { name: RUST_LOG, value: {{ .Values.rustLog | quote }} }
          securityContext: {{ include "enzarb.securityContext" (dict "ctx" . "uid" 65532) | fromYaml | toJson }}
          volumeMounts:
            {{- include "enzarb.claudeKeyMount" . | nindent 12 }}
      volumes:
        {{- include "enzarb.claudeKeyVolume" . | nindent 8 }}
{{- end }}
