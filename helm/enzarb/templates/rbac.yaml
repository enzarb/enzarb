{{- /* ServiceAccounts */}}
{{- range tuple "enzarb-ui" "enzarb-workflows" "enzarb-connectors" "enzarb-sandbox-proxy" "enzarb-sandbox-operator" "enzarb-migrate" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  labels:
    {{- include "enzarb.labels" (dict "ctx" $ "name" .) | nindent 4 }}
---
{{- end }}
{{- /* ui: create/list/delete Project CRs. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enzarb-ui
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-ui") | nindent 4 }}
rules:
  - apiGroups: [enzarb.dev]
    resources: [projects]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enzarb-ui
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-ui") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: enzarb-ui }
subjects:
  - { kind: ServiceAccount, name: enzarb-ui, namespace: {{ .Release.Namespace }} }
---
{{- /* workflows: project index + sandbox-auth tokens (secrets narrowed to sandbox-auth). */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enzarb-workflows
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-workflows") | nindent 4 }}
rules:
  - apiGroups: [enzarb.dev]
    resources: [projects]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [sandbox-auth]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enzarb-workflows
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-workflows") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: enzarb-workflows }
subjects:
  - { kind: ServiceAccount, name: enzarb-workflows, namespace: {{ .Release.Namespace }} }
---
{{- /* sandbox-proxy */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enzarb-sandbox-proxy
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-proxy") | nindent 4 }}
rules:
  - apiGroups: [enzarb.dev]
    resources: [projects]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [sandbox-auth]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enzarb-sandbox-proxy
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-proxy") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: enzarb-sandbox-proxy }
subjects:
  - { kind: ServiceAccount, name: enzarb-sandbox-proxy, namespace: {{ .Release.Namespace }} }
---
{{- /* operator: from enzarb-sandbox-operator deploy/rbac.yaml. The secrets `get` is narrowed
       to sandbox-auth (the only Secret it reads); `create` cannot be name-restricted. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enzarb-sandbox-operator
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 4 }}
rules:
  - apiGroups: [enzarb.dev]
    resources: [projects]
    verbs: [get, list, watch, patch]
  - apiGroups: [enzarb.dev]
    resources: [projects/status]
    verbs: [patch]
  - apiGroups: [capsule.clastix.io]
    resources: [tenants]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [sandbox-auth]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, patch]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enzarb-sandbox-operator
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: enzarb-sandbox-operator }
subjects:
  - { kind: ServiceAccount, name: enzarb-sandbox-operator, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enzarb-sandbox-operator-leader
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enzarb-sandbox-operator-leader
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-sandbox-operator") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: enzarb-sandbox-operator-leader }
subjects:
  - { kind: ServiceAccount, name: enzarb-sandbox-operator, namespace: {{ .Release.Namespace }} }
{{- if .Values.postgres.enabled }}
---
{{- /* Init containers (kubectl wait) of the migration Jobs and runtime pods. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enzarb-wait
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb") | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [pgop.ruck.io]
    resources: [clusters, databases, roles]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enzarb-wait
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: enzarb-wait }
subjects:
  {{- range tuple "enzarb-ui" "enzarb-workflows" "enzarb-connectors" "enzarb-migrate" }}
  - { kind: ServiceAccount, name: {{ . }}, namespace: {{ $.Release.Namespace }} }
  {{- end }}
{{- end }}
