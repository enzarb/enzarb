{{- /*
Migration Jobs, ordered legacy -> connectors -> ui -> tracks (tracks only with event routing). These are ordinary resources (not
Helm hooks, so `helm install --wait` cannot deadlock on pods that need migrated schemas).
Ordering is enforced with init containers (`kubectl wait`):
  legacy     waits for the pgop Cluster, Database and all Roles to be ready, then drops the
             schemas of the removed workflow engine (receiver drop-legacy, idempotent, as the
             old schema owner);
  connectors waits for the legacy Job;
  ui         waits for the connectors Job;
  tracks     waits for the ui Job (schema `tracks`, ADR-0029);
  runtime Deployments wait for the last Job of the chain.
Job names carry a hash of the rendered Job inputs (see enzarb.migrateJob), so any change gets a fresh Job.
*/}}
{{- if .Values.postgres.enabled }}
{{- $steps := list
  (dict "comp" "legacy" "c" .Values.connectors "uid" 10001 "role" "workflows-owner")
  (dict "comp" "connectors" "c" .Values.connectors "uid" 10001 "role" "connectors-owner" "wait" (include "enzarb.migrateJob" (dict "ctx" $ "comp" "legacy")))
  (dict "comp" "ui" "c" .Values.ui "uid" 1000 "role" "ui-owner" "wait" (include "enzarb.migrateJob" (dict "ctx" $ "comp" "connectors"))) }}
{{- if include "enzarb.tracksRouting" . }}
{{- $steps = append $steps (dict "comp" "tracks" "c" .Values.tracks "uid" 10001 "role" "tracks-owner" "wait" (include "enzarb.migrateJob" (dict "ctx" $ "comp" "ui"))) }}
{{- end }}
{{- range $i, $s := $steps }}
{{- if $i }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "enzarb.migrateJob" (dict "ctx" $ "comp" $s.comp) }}
  labels:
    {{- include "enzarb.labels" (dict "ctx" $ "name" (printf "enzarb-migrate-%s" $s.comp)) | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "enzarb.selector" (dict "ctx" $ "name" (printf "enzarb-migrate-%s" $s.comp)) | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: enzarb-migrate
      restartPolicy: OnFailure
      {{- include "enzarb.pullSecrets" $ | nindent 6 }}
      initContainers:
        {{- if $s.wait }}
        {{- include "enzarb.waitJob" (dict "ctx" $ "job" $s.wait) | nindent 8 }}
        {{- else }}
        {{- include "enzarb.waitPg" $ | nindent 8 }}
        {{- end }}
      containers:
        - name: migrate
          image: {{ include "enzarb.image" $s.c }}
          imagePullPolicy: {{ include "enzarb.pullPolicy" (dict "ctx" $ "c" $s.c) }}
          {{- if eq $s.comp "legacy" }}
          args: [drop-legacy]
          {{- else if or (eq $s.comp "connectors") (eq $s.comp "tracks") }}
          args: [migrate]
          {{- else }}
          command: [node, scripts/migrate.ts]
          {{- end }}
          env:
            {{- include "enzarb.dbEnv" (dict "ctx" $ "role" $s.role "urlSslmode" (eq $s.comp "ui")) | nindent 12 }}
            - { name: RUST_LOG, value: {{ $.Values.rustLog | quote }} }
          securityContext: {{ include "enzarb.securityContext" (dict "ctx" $ "uid" $s.uid) | fromYaml | toJson }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
{{- end }}
