{{- if .Values.updater.enabled }}
{{- $c := .Values.updater }}
{{- $s := .Values.secrets.updater }}
{{- $webhook := $c.webhook.enabled }}
{{- $pollSecs := int $c.poll.intervalSecs }}
{{- if and (not $webhook) (eq $pollSecs 0) }}
{{- fail "updater: enable updater.webhook.enabled or set updater.poll.intervalSecs (>= 30); otherwise it has nothing to do" }}
{{- end }}
{{- if and (gt $pollSecs 0) (lt $pollSecs 30) }}
{{- fail "updater.poll.intervalSecs must be 0 or at least 30" }}
{{- end }}
{{- $ownsSecret := and (not $s.existingSecret) (or $webhook $s.registryToken) }}
{{- /* The HelmChart CR (and its spec.version) is owned by the cluster and patched by the
       updater; this chart never renders it. */}}
{{- if $ownsSecret }}
{{- /* Webhook secret (webhook only): inline value, else generated once and kept: lookup reads the live Secret on upgrade. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "enzarb.updaterSecret" .)) | default dict }}
{{- $old := get $existing "data" | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enzarb.updaterSecret" . }}
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
type: Opaque
data:
  {{- if $webhook }}
  updater-webhook-secret: {{ if $s.webhookSecret }}{{ $s.webhookSecret | b64enc }}{{ else }}{{ get $old "updater-webhook-secret" | default (randAlphaNum 48 | b64enc) }}{{ end }}
  {{- end }}
  {{- if $s.registryToken }}
  updater-registry-token: {{ $s.registryToken | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enzarb-updater
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
---
{{- /* Patch the cluster-owned HelmChart `enzarb` only. resourceNames cannot limit list/watch, so
       only get and patch are granted. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enzarb-updater
  namespace: kube-system
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
rules:
  - apiGroups: [helm.cattle.io]
    resources: [helmcharts]
    resourceNames: [enzarb]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enzarb-updater
  namespace: kube-system
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: enzarb-updater }
subjects:
  - { kind: ServiceAccount, name: enzarb-updater, namespace: {{ .Release.Namespace }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enzarb-updater
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  {{- include "enzarb.rollout" $c | nindent 2 }}
  selector:
    matchLabels:
      {{- include "enzarb.selector" (dict "ctx" . "name" "enzarb-updater") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 8 }}
    spec:
      serviceAccountName: enzarb-updater
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- include "enzarb.pullSecrets" . | nindent 6 }}
      containers:
        - name: updater
          image: {{ include "enzarb.image" $c }}
          imagePullPolicy: {{ include "enzarb.pullPolicy" (dict "ctx" . "c" $c) }}
          ports:
            - { name: http, containerPort: {{ $c.port }} }
          env:
            {{- if $webhook }}
            {{- include "enzarb.secretEnv" (dict "name" "ENZARB_UPDATER_WEBHOOK_SECRET" "secret" (include "enzarb.updaterSecret" .) "key" (include "enzarb.updaterKey" (dict "ctx" . "key" "webhookSecret"))) | nindent 12 }}
            {{- end }}
            {{- if include "enzarb.updaterHasRegistryToken" . }}
            {{- include "enzarb.secretEnv" (dict "name" "ENZARB_UPDATER_REGISTRY_TOKEN" "secret" (include "enzarb.updaterTokenSecret" .) "key" (include "enzarb.updaterTokenKey" .)) | nindent 12 }}
            {{- end }}
            - { name: ENZARB_UPDATER_POLL_SECS, value: {{ $pollSecs | quote }} }
            - { name: ENZARB_UPDATER_LISTEN, value: {{ printf "0.0.0.0:%v" $c.port | quote }} }
            - { name: RUST_LOG, value: {{ .Values.rustLog | quote }} }
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ if gt $pollSecs 0 }}/readyz{{ else }}/healthz{{ end }}, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          {{- with include "enzarb.preStop" $c }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{ include "enzarb.securityContext" (dict "ctx" . "uid" 10001) | fromYaml | toJson }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: enzarb-updater
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
spec:
  selector:
    {{- include "enzarb.selector" (dict "ctx" . "name" "enzarb-updater") | nindent 4 }}
  ports:
    - { name: http, port: {{ $c.port }}, targetPort: http }
{{- end }}
