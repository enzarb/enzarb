{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
{{- /* Role resource names (Kubernetes) -> PostgreSQL role names. roleName is immutable. */}}
{{- $roles := list
  (dict "name" "workflows-owner" "role" "enzarb_workflows_owner")
  (dict "name" "workflows" "role" "enzarb_workflows")
  (dict "name" "connectors-owner" "role" "enzarb_connectors_owner")
  (dict "name" "connectors" "role" "enzarb_connectors")
  (dict "name" "ui-owner" "role" "enzarb_ui_owner")
  (dict "name" "ui" "role" "enzarb_ui")
  (dict "name" "sandbox-proxy" "role" "enzarb_sandbox_proxy") }}
{{- /* realtime owns no objects; it reads connectors.event_v (granted by the connectors migration). */}}
{{- /* The workflows roles are legacy: enzarb_workflows_owner stays the Database owner and runs the one-off drop of the removed engine schemas (migrations.yaml). */}}
{{- if .Values.realtime.enabled }}
{{- $roles = append $roles (dict "name" "realtime" "role" "enzarb_realtime") }}
{{- end }}
apiVersion: pgop.ruck.io/v1alpha1
kind: Cluster
metadata:
  name: {{ $pg.clusterName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-postgres") | nindent 4 }}
spec:
  image: {{ $pg.image }}
  storage:
    size: {{ $pg.storage.size }}
    retainPolicy: {{ $pg.storage.retainPolicy }}
    {{- with $pg.storage.storageClassName }}
    storageClassName: {{ . }}
    {{- end }}
  {{- with $pg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- range $roles }}
---
apiVersion: pgop.ruck.io/v1alpha1
kind: Role
metadata:
  name: {{ .name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "enzarb.labels" (dict "ctx" $ "name" "enzarb-postgres") | nindent 4 }}
spec:
  clusterRef:
    name: {{ $pg.clusterName }}
  roleName: {{ .role }}
  login: true
{{- end }}
---
apiVersion: pgop.ruck.io/v1alpha1
kind: Database
metadata:
  name: {{ $pg.databaseName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "enzarb.labels" (dict "ctx" . "name" "enzarb-postgres") | nindent 4 }}
spec:
  clusterRef:
    name: {{ $pg.clusterName }}
  databaseName: {{ $pg.databaseName }}
  # Database.owner is a Role resource name.
  owner: workflows-owner
  # schemas[].owner and grants[].role are raw PostgreSQL role names. Object-level grants
  # (views, functions, default privileges) are written by each owner's migrations.
  schemas:
    - name: connectors
      owner: enzarb_connectors_owner
      grants:
        - { role: enzarb_connectors, privileges: [USAGE] }
        - { role: enzarb_ui, privileges: [USAGE] }
        {{- if .Values.realtime.enabled }}
        - { role: enzarb_realtime, privileges: [USAGE] }
        {{- end }}
    - name: app
      owner: enzarb_ui_owner
      grants:
        - { role: enzarb_ui, privileges: [USAGE] }
    - name: app_api
      owner: enzarb_ui_owner
      grants:
        - { role: enzarb_ui, privileges: [USAGE] }
        - { role: enzarb_sandbox_proxy, privileges: [USAGE] }
{{- end }}
