# kind development: images are `kind load`ed, never pulled.
host: enzarb.local
imagePullPolicy: Never

postgres:
  storage:
    size: 2Gi

secrets:
  github:
    appId: "0"
    privateKey: dev-placeholder
    webhookSecret: dev-webhook-secret
    oauthClientId: dev-client-id
    oauthClientSecret: dev-client-secret

ui:
  image: { tag: dev }
workflows:
  image: { tag: dev }
connectors:
  image: { tag: dev }
realtime:
  image: { tag: dev }
sandboxProxy:
  image: { tag: dev }
operator:
  docker:
    storage: 5Gi   # kind disk is small; prod default is 50Gi
  replicaCount: 1
  image: { tag: dev }
  sandboxImage: ghcr.io/enzarb/enzarb-sandbox:dev
  sandboxRuntimeClass: gvisor

sandbox:
  egress:
    # kind: pod, service and node networks (contain the API server). 172.18.0.0/16 assumes
    # docker's default `kind` network subnet: check with `docker network inspect kind`.
    # Dual-stack clusters must also list their IPv6 CIDRs.
    clusterCIDRs: [10.244.0.0/16, 10.96.0.0/12, 172.18.0.0/16]
